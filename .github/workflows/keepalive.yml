name: Supabase keep-alive

# Houdt het gratis Supabase-project actief. Een gratis project pauzeert na
# ~1 week zonder activiteit; dan valt de hele site om (login, ledenlijst).
# Deze taak doet elke dag één lichte database-query zodat dat niet gebeurt.
#
# We gebruiken hier de PUBLIEKE anon-key. Die staat sowieso al in de website
# (elke bezoeker krijgt 'm mee) en geeft alleen leesrechten die door de
# Supabase-beveiligingsregels (RLS) worden beperkt — dus geen geheim nodig.

on:
  schedule:
    - cron: '17 6 * * *'   # elke dag rond 06:17 UTC
  workflow_dispatch:        # ook handmatig te starten via de Actions-tab
  push:                     # test-run zodra dit bestand zelf verandert
    paths:
      - .github/workflows/keepalive.yml

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (echte database-query)
        run: |
          URL="https://mxbtmbcgycjqapjzulrp.supabase.co/rest/v1/wijzigingsverzoeken?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YnRtYmNneWNqcWFwanp1bHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDQ4MzgsImV4cCI6MjA5MzQ4MDgzOH0.6Qowa_mqhH7YtrljF5fZnQzUaG_u4N5TodcnLzRhYSM"
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
            "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase antwoordde met HTTP $code"
