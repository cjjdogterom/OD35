<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Huisrekening Omega Ksi</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"><style>:root{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style><style id="app-style">
/* Layout: rekeningoverzicht — kopregel met maandkeuze, tabbalk, afschrift-tabellen met dunne lijnen; één accent (marineblauw), cijfers in mono */
:root{

  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151b; --surface:#161c23; --sunk:#1d242d; --ink:#e5e9ee; --muted:#97a2af; --line:#29313b; --strong:#3a4450;
  --accent:#86b4e8; --accent-ink:#0d1620; --accent-soft:#1b2a3b;
  --ok:#6cc48e; --ok-soft:#163023; --warn:#e2a548; --warn-soft:#33270f; --crit:#f07a6e; --crit-soft:#3a1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151b; --surface:#161c23; --sunk:#1d242d; --ink:#e5e9ee; --muted:#97a2af; --line:#29313b; --strong:#3a4450;
  --accent:#86b4e8; --accent-ink:#0d1620; --accent-soft:#1b2a3b;
  --ok:#6cc48e; --ok-soft:#163023; --warn:#e2a548; --warn-soft:#33270f; --crit:#f07a6e; --crit-soft:#3a1916; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.boot{padding:40px 16px;color:var(--muted)}

h3{font-size:1rem}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.small{font-size:.85rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}

.opslag{font-size:12px;color:var(--muted,#888);margin-right:6px;white-space:nowrap}
.opslag.ok{color:var(--ok,#2e7d32)}
.opslag.fout{color:var(--neg,#b3261e);font-weight:600}
.opslag button{padding:2px 6px!important;font-size:12px}
.maandkeuze{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.maandkeuze select{min-width:11rem;font-weight:500}
.months{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.months button{border:0;border-radius:0;border-left:1px solid var(--line);font-weight:500;padding:7px 12px;background:none}
.months button:first-child{border-left:0}
.months button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--strong);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}

button,.btn{font:500 .88rem var(--f-body);border-radius:var(--r);border:1px solid var(--strong);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-within,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-left:1px solid var(--line);font-size:.84rem;padding:6px 11px;background:none;color:var(--muted)}

.badge{display:inline-block;font:600 .68rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--strong);border-radius:var(--r);padding:6px 8px;min-width:0;max-width:100%}
input[type="number"]{font-family:var(--f-num);text-align:right}
input:disabled,select:disabled,textarea:disabled{background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;padding-inline:0}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);padding:0}
label.field{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:12px 16px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .v{font:600 1.45rem var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:.76rem;color:var(--muted);font-weight:500}
.kpi .s{font-size:.75rem;color:var(--muted)}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{font:600 .7rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--strong);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.ledger td.rank{font-family:var(--f-num);color:var(--muted);width:2.5em}
tr.click{cursor:pointer}

.stmt{width:100%;border-collapse:collapse;font-size:.9rem}

.stmt tr.grp.tog{cursor:pointer}

.stmt tr.grp td{font-weight:600;padding-top:12px;border-bottom:1px solid var(--strong)}
.stmt tr.ln td:first-child{padding-left:20px}
.stmt tr.ln.has{cursor:pointer}
.stmt tr.ln.has:hover td{background:var(--sunk)}
.stmt .how{display:block;font-size:.78rem;color:var(--muted)}
.stmt .chev{display:inline-block;width:1em;color:var(--accent);font-size:.75rem}
.stmt tr.det td{background:var(--sunk);padding:10px 12px 12px 20px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;font-size:.84rem;max-width:560px}
.calc .t{border-top:1px solid var(--strong);padding-top:3px;font-weight:600}
.calc .t+.t{border-top:0;padding-top:0}
.calc .op{color:var(--muted)}
.mini{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.mini td,.mini th{padding:4px 6px;border-bottom:1px solid var(--line);background:transparent}
.me{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.6fr);gap:22px;align-items:start}

.big{font:600 2.4rem/1.1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}

.bars .bar{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem;padding:3px 0}

.tx{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 7rem minmax(0,15rem) auto;gap:6px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .who{min-width:0}
.tx .who b{display:block;overflow-wrap:anywhere;font-weight:600}

.matrix th.c{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;vertical-align:bottom;padding:8px 4px;max-height:190px;white-space:nowrap;font-size:.68rem}
.matrix td.c{text-align:center;padding:4px}
th.wrap{white-space:normal;vertical-align:bottom;min-width:5.5rem}
tr.grp-row td{background:var(--sunk);border-bottom:1px solid var(--strong)}
.matrix td.n,.matrix th.n{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--strong);border-radius:var(--r);background:var(--surface)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .in{max-width:1120px;margin:0 auto;padding:11px max(16px,env(safe-area-inset-left,0px)) 11px max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar button{border-color:transparent}
.savebar button.ghost{color:var(--paper)}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 16px;border-radius:var(--r);box-shadow:0 6px 24px rgb(0 0 0 / .15);max-width:min(92vw,520px);font-size:.9rem}
.toast.err{border-left-color:var(--crit)}
.imp-cel{white-space:nowrap}
.imp-cel .imp-bedrag{width:5.6rem;margin-left:4px;text-align:right;font-variant-numeric:tabular-nums}

.imp-cel.anders .imp-bedrag{font-weight:700}

.imp-los{padding:0 4px!important;margin-left:2px;border:0!important;background:none!important}
.stmt tr.aanp td{font-size:13px;color:var(--muted,#777);padding-left:18px}
.linkknop{border:0!important;background:none!important;padding:0 0 0 6px!important;color:var(--accent,#2a4d82);text-decoration:underline;font-size:13px;cursor:pointer}

/* Brede tabellen voor oude maanden: de volle schermbreedte, compacte kolommen */
.block.breed{width:calc(100vw - 32px);max-width:none;position:relative;left:50%;transform:translateX(-50%)}

.meldknop{padding:0 4px!important;margin-left:6px;font-size:13px;line-height:1;opacity:.55;border:0!important;background:none!important;vertical-align:middle}

function koppelHuislasten(d){
  const norm=x=>String(x||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
  const woord=m=>new RegExp('(^|[^A-Z0-9])'+m.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Z0-9])');
  const open=new Set((d.months||[]).filter(m=>!m.closed).map(m=>m.id));
  for(const t of d.transactions||[]){if(t.kind!=='cost'||t.huislastId||!open.has(t.monthId))continue;
    const hay=((t.name||'')+' '+(t.desc||'')).toUpperCase(),lb=norm(t.label);
    const h=(d.huislasten||[]).find(h=>h.type!=='pp'&&((h.match||'').split(',').map(x=>x.trim()).filter(Boolean).some(x=>woord(x).test(hay))||(lb&&norm(h.name)===lb)));

function txPayers(t){if(t.participants&&t.participants.length)return t.participants.filter(id=>P(id));if(t.huislastId){const h=H(t.huislastId);return h?h.payers.filter(id=>P(id)):[]}const c=C(t.categoryId);return c?c.payers.filter(id=>P(id)):[]}
function eventTx(e){return S.transactions.filter(t=>t.kind==='event'&&t.eventId===e.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function eventTotal(e){return sum(eventTx(e).map(t=>-t.amount))+(+e.extra||0)}
function eventCalc(e){
  const txs=eventTx(e),txTotal=sum(txs.map(t=>-t.amount)),extra=+e.extra||0,total=txTotal+extra;
  const c=C(e.categoryId),min=c?+c.minimum||0:0,ov=e.overrides||{};
  const parts=(e.participants||[]).filter(id=>P(id));
  const fixed=Object.keys(ov).filter(id=>ov[id]!=null&&P(id));
  const fixedTotal=sum(fixed.map(id=>ov[id]));
  const free=parts.filter(id=>!fixed.includes(id));
  let non=min>0&&c?c.payers.filter(id=>P(id)&&!parts.includes(id)&&!fixed.includes(id)):[];
  let rest=total-fixedTotal,shares={},equalAll=false,minTotal=0;
  fixed.forEach(id=>shares[id]={a:+ov[id],why:'vast bedrag'});
  if(non.length&&free.length&&(rest-min*non.length)/free.length<min){
    equalAll=true;const all=free.concat(non);all.forEach(id=>shares[id]={a:rest/all.length,why:parts.includes(id)?'deelnemer':'gelijk verdeeld (onder minimum)'});
  }else{
    minTotal=min*non.length;non.forEach(id=>shares[id]={a:min,why:'minimum niet-deelnemer'});
    const per=free.length?(rest-minTotal)/free.length:0;free.forEach(id=>shares[id]={a:per,why:'deelnemer'});
  }

function eventShares(e){return eventCalc(e).shares}
function serviceShares(){
  const known=S.rooms.filter(r=>r.servicekosten!=null&&r.servicekosten!=='');
  const avg=known.length?sum(known.map(r=>+r.servicekosten))/known.length:0;
  const parts={},out={};
  const get=id=>parts[id]=parts[id]||{diff:0,kale:0,mu:0,diffHow:''};
  for(const r of S.rooms){if(r.personId&&P(r.personId)){const x=get(r.personId),k=r.servicekosten!=null&&r.servicekosten!=='';
    x.diff+=k?avg-r.servicekosten:0;x.diffHow=k?`gemiddeld ${eur(avg)} − kamer ${r.name} ${eur(r.servicekosten)}`:`kamer ${r.name}: servicekosten onbekend, telt als gemiddeld`}}

  for(const id in parts){const x=parts[id];out[id]=x.diff+x.kale+x.mu}

}
const PS=()=>S.pilsSettings;
const barPrice=()=>PS().barPrice!=null&&PS().barPrice!==''?+PS().barPrice:(+PS().fust20Price||0)/(+PS().turfPerFust20||100);

const has=v=>v!=null&&v!=='';
function pilsCalc(pl){
  const ps=PS(),bp=barPrice(),fp=flesPrice();
  const barTurf=sum(Object.values(pl.bar.turven||{})),nesTurf=sum(Object.values(pl.nestor.turven||{}));
  const barHo=+pl.bar.ho||0,nesHo=+pl.nestor.ho||0;
  const f=pl.fust,k=pl.krat,tb=pilsTxBought(pl);
  const af=type=>sum((pl.afkoop||[]).filter(a=>a.type===type).map(a=>+a.count||0));
  const af20=af('fust20'),af50=af('fust50'),afK=af('krat');
  const fustKnown=has(f.end20)||has(f.end50);
  const door20=fustKnown?(+f.begin20||0)+(+f.bought20||0)+tb.b20-(+f.end20||0):null;
  const door50=fustKnown?(+f.begin50||0)+(+f.bought50||0)+tb.b50-(+f.end50||0):null;
  const bar20=fustKnown?door20-af20:null,bar50=fustKnown?door50-af50:null;
  const expTap=fustKnown?bar20*(+ps.turfPerFust20||100)+bar50*(+ps.turfPerFust50||250):null;
  const tapZoek=fustKnown?expTap-barTurf-barHo:null;
  const tapEur=fustKnown?tapZoek*bp:0;
  const kratKnown=has(k.end);
  const doorK=kratKnown?(+k.begin||0)+(+k.bought||0)+tb.bk-(+k.end||0):null;
  const nesK=kratKnown?doorK-afK:null;
  const expFles=kratKnown?nesK*(+ps.flesPerKrat||24):null;
  const flesZoek=kratKnown?expFles-nesTurf-nesHo:null;

  const posts=(pl.shared||[]).map(x=>{const txs=ptx.filter(t=>t.pilsPost===x.id),txSum=sum(txs.map(t=>-t.amount));let base=0,desc='';
    if(x.kind==='tap'){base=tapEur;desc=fustKnown?`${nf(tapZoek)} turfjes zoek × ${eur3(bp)}`:'eindvoorraad fusten nog niet geteld'}
    else if(x.kind==='fles'){base=flesEur;desc=kratKnown?`${nf(flesZoek)} flesjes zoek × ${eur3(fp)}`:'eindvoorraad kratten nog niet geteld'}

}
const billCache=new Map();

  const keep={};for(const k of CFG_KEYS)if(c[k]!==undefined&&S[k]!==c[k]){keep[k]=S[k];S[k]=c[k]}
  try{return fn()}finally{for(const k in keep)S[k]=keep[k]}
}
// Eerdere maand bekijken als beheerder: de instellingen van die maand worden tijdelijk de actieve.

}

  if(UI.cfgMaand&&UI.globCfg){bewaarMaandCfg();for(const k of CFG_KEYS)S[k]=UI.globCfg[k]}
  UI.cfgMaand=null;UI.globCfg=null;
  if(doel){openzetten(doel);UI.globCfg=Object.fromEntries(CFG_KEYS.map(k=>[k,S[k]]));for(const k of CFG_KEYS)if(doel.cfg[k]!==undefined)S[k]=doel.cfg[k];UI.cfgMaand=doel.id}

// Iets doen met de algemene instellingen actief (opslaan, concept bewaren).
// Wat je in een afgesloten maand aanpast staat in S; schrijf het terug naar die maand (m.cfg),
// ook als een lijst vervangen is in plaats van aangepast (bijv. na verwijderen).
function bewaarMaandCfg(){

  for(const k of CFG_KEYS)if(S[k]!==UI.globCfg[k])m.cfg[k]=S[k];

function txRegels(m,B,add,mid,alleen){
  for(const t of S.transactions.filter(t=>t.monthId===mid&&(!alleen||alleen(t)))){
    if(t.kind==='payment'&&B[t.personId]){B[t.personId].paid+=t.amount;B[t.personId].payments.push({date:t.date,amount:t.amount,note:t.name})}
    if(t.kind==='cost'){
      const h=t.huislastId&&H(t.huislastId),c=C(t.categoryId),cost=-t.amount,ids=txPayers(t);
      for(const id of ids)add(id,{cat:h?'Huislasten':(c?c.name:'Overig'),label:t.label||(h&&h.name)||t.name,amount:cost/ids.length,how:`${eur(cost)} ÷ ${ids.length} personen`,ref:{type:'tx',id:t.id}});
    }
    if(t.paidBy&&B[t.paidBy]&&['cost','event','pils'].includes(t.kind)){const v=-t.amount;B[t.paidBy].paid+=v;B[t.paidBy].payments.push({date:t.date,amount:v,note:'voorgeschoten: '+(t.label||t.name)})}
  }
}

// Maand uit de oude Excel: de vastgelegde regels, met de aanpassingen van de beheerder verwerkt in de posten zelf.
function excelRegels(m,B,add,mid){
  const snap=m.snapshot||{};
  for(const id in snap){const b=B[id];if(!b)continue;const x=snap[id];
    b.lines=(x.lines||[]).map(l=>({...l}));b.paid=+x.paid||0;b.payments=(x.payments||[]).map(y=>({...y}))}
  const extra=[],addA=(id,l)=>{if(B[id]&&Math.abs(l.amount)>0.00001)extra.push([id,l])};
  (function(add){
  {
    for(const cat of IMP_CATS)if(m.impAanp&&m.impAanp[cat])for(const [label,d] of Object.entries(impVerschillen(m,cat)))for(const id in d)
      if(Math.abs(d[id])>0.004)add(id,{cat,label:`Aanpassing ${label}`,amount:d[id],how:impReden(m,cat,label),ref:{type:'imp',cat,label}});
    if(m.afkoopAanp){const d=afkoopImpVerschil(m),lb=(Object.values(m.snapshot||{}).flatMap(b=>b.lines||[]).find(l=>l.cat==='Pils'&&isAfkoop(l.label))||{label:'Fust afkoop'}).label;
      for(const id in d)if(Math.abs(d[id])>0.004)add(id,{cat:'Pils',label:`Aanpassing ${lb}`,amount:d[id],how:afkoopReden(m),ref:{type:'imp',cat:'Pils'}})}
    if(m.scAanp){const oud=scImport(m);for(const id in m.scAanp){const d=(+m.scAanp[id]||0)-(oud[id]||0);
      if(Math.abs(d)>0.004)add(id,{cat:'Servicekosten',label:'Aanpassing servicekosten',amount:d,how:'aangepast door de beheerder',ref:{type:'imp',cat:'Servicekosten'}})}}
  }
  // Per pilspost een eigen aanpassingsregel (turven bar, flesjes Nestor, …), zodat het overzicht ze bij de juiste post toont.
  if(m.pilsAanp){const imp=pilsImport(m);for(const id in m.pilsAanp){const n=pilsImpNieuw(m,id,imp);
    for(const lb of new Set([...Object.keys(n.cells),...Object.keys(n.oud.cells)])){const d=(n.cells[lb]||0)-(n.oud.cells[lb]||0);
      if(Math.abs(d)>0.004)add(id,{cat:'Pils',label:`Aanpassing ${lb}`,amount:d,how:lb===TAP?`${n.tap} tapturven × ${eur3(imp.tapPrijs)}`:lb===FLES?`${n.cnt} flesjes × ${eur3(imp.prijs)}`:'aangepast door de beheerder',ref:{type:'pils',kind:'aanp'}})}}}
  })(addA);
  for(const [id,d] of extra){const b=B[id],kaal=d.label.replace(/^Aanpassing /,'');
    const l=b.lines.find(x=>x.cat===d.cat&&x.label===kaal);
    const telt=/^\d+ (tapturven|flesjes) ×/.test(d.how||''),reden=telt?d.how:(d.how||'');
    if(l){l.how=telt?`${d.how} · was ${eur(l.amount)}`:`was ${eur(l.amount)}`;l.reden=reden;l.amount+=d.amount;l.aangepast=true}
    else b.lines.push({...d,label:kaal,how:'nieuw',reden,aangepast:true})}
  for(const id in B)B[id].lines=B[id].lines.filter(l=>Math.abs(l.amount)>0.004||!l.aangepast);
  // Wat de beheerder later aan deze maand toevoegt (transacties, kopjes) telt gewoon mee.
  txRegels(m,B,add,mid,t=>t.naImport);
  for(const e of S.events.filter(e=>e.billMonth===mid&&e.naImport)){const k=eventCalc(e);
    for(const id in k.shares)add(id,{cat:'Extra correctie',label:e.name,amount:k.shares[id].a,how:k.shares[id].why==='vast bedrag'?'vast bedrag':`${eur(k.rest)} verdeeld`,ref:{type:'event',id:e.id}})}
}
function bill(mid){
  const m=M(mid);if(!m)return {};
  if(billCache.has(mid))return billCache.get(mid);
  const i=S.months.indexOf(m),pm=i>0?S.months[i-1]:null,prev=pm?bill(pm.id):null,snap=impMaand(m)?m.snapshot:null;
  const B={};
  for(const p of S.people){
    // Beginsaldo = eindsaldo vorige maand. Staat iemand daar op nul maar heeft de Excel van deze maand een beginsaldo
    // (bijv. een oud-huisgenoot die er toen pas bij kwam), dan dat beginsaldo.
    const pe=prev&&prev[p.id]?prev[p.id].end:null,ss=snap&&snap[p.id]?snap[p.id].start:null;
    const st=pe!=null&&(Math.abs(pe)>0.004||ss==null)?pe:(ss!=null?ss:(prev||snap?0:(+p.startSaldo||0)));
    B[p.id]={start:st,paid:0,lines:[],end:st,payments:[]}}
  const add=(id,l)=>{if(B[id]&&Math.abs(l.amount)>0.00001)B[id].lines.push(l)};
  metMaandCfg(m,()=>snap?excelRegels(m,B,add,mid):gewoneRegels(m,B,add,mid));
  for(const id in B){const b=B[id];b.charges=sum(b.lines.map(l=>l.amount));b.end=b.start-b.paid+b.charges;
    // Excel-maand: de verandering ten opzichte van de Excel, opgeteld bij wat de Excel zelf als mutatie had.
    const x=snap&&snap[id];if(x){const exCh=sum((x.lines||[]).map(l=>l.amount)),exPaid=+x.paid||0;
      b.end=b.start+(x.end-x.start)+(b.charges-exCh)-(b.paid-exPaid)}}
  billCache.set(mid,B);return B;
}

function parseCSV(text){
  text=text.replace(new RegExp('^'+String.fromCharCode(65279)),'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x!==''))rows.push(row);
  return rows;
}
function parseAmount(s){s=String(s||'').trim().replace(/\s|€/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
function parseDate(s){s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function classify(t){
  const hay=(t.name+' '+t.desc).toUpperCase();
  if(t.amount>0){
    const p=S.people.find(p=>t.iban&&(p.ibans||[]).includes(t.iban))||S.people.find(p=>(p.aliases||[]).some(a=>a&&hay.includes(a.toUpperCase())));
    if(p){t.kind='payment';t.personId=p.id;t.auto=true;return}
  }
  const word=m=>new RegExp('(^|[^A-Z0-9])'+m.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Z0-9])');
  const hm=(S.huislasten||[]).find(h=>h.type!=='pp'&&(h.match||'').split(',').map(x=>x.trim()).filter(Boolean).some(x=>word(x).test(hay)));
  if(hm){t.kind='cost';t.huislastId=hm.id;t.label=hm.name;t.auto=true;return}
  const rule=S.bankRules.find(r=>r.match&&word(r.match).test(hay));
  if(rule&&rule.action==='voorschot'&&t.amount>0){t.kind='kas';t.label='Terugbetaling: '+(rule.label||rule.match);t.auto=true;return}
  if(rule){t.kind=rule.action==='kas'?'kas':rule.action==='voorschot'?'voorschot':'cost';t.categoryId=rule.action==='cost'?rule.categoryId||null:null;t.label=rule.label||'';if(t.kind==='voorschot')t.vsWhat=rule.label||'';t.auto=true;return}
  if(t.amount>0){
    const c=S.people.filter(p=>p.name.length>2&&new RegExp('(^|[^a-z])'+p.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])').test((t.name+' '+t.desc).toLowerCase()));
    if(c.length===1){t.kind='payment';t.personId=c[0].id;t.suggested=true;return}
  }
  t.kind='todo';
}
function importING(text){
  const rows=parseCSV(text);if(rows.length<2)return toast('Dit bestand bevat geen regels. Kies het afschrift dat je uit Mijn ING hebt gedownload.',true);
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=h.findIndex(x=>x===n);if(i>=0)return i}for(const n of names){const i=h.findIndex(x=>x.startsWith(n));if(i>=0)return i}return -1};
  const I={date:col('datum'),name:col('naam / omschrijving','naam'),tegen:col('tegenrekening'),afbij:col('af bij','af/bij'),amt:col('bedrag (eur)','bedrag'),mut:col('mutatiesoort'),med:col('mededelingen','omschrijving'),saldo:col('saldo na mutatie','saldo')};
  if(I.date<0||I.amt<0)return toast('Ik herken de kolommen niet. Gebruik de CSV- of PDF-download van ING.',true);
  let latest=null;const out=[];
  for(const r of rows.slice(1)){
    const date=parseDate(r[I.date]);if(!date)continue;
    const raw=parseAmount(r[I.amt]);const af=I.afbij>=0?/^af/i.test(r[I.afbij]||''):raw<0;
    out.push({date,amount:af?-Math.abs(raw):Math.abs(raw),name:(r[I.name]||'').trim(),iban:(I.tegen>=0?(r[I.tegen]||'').replace(/\s/g,'').toUpperCase():''),
      desc:[(I.mut>=0?r[I.mut]:''),(I.med>=0?r[I.med]:'')].filter(Boolean).join(' · ').trim()});
    if(I.saldo>=0&&r[I.saldo]){if(!latest||date>=latest.date)latest={date,saldo:parseAmount(r[I.saldo])}}
  }
  commitImport(out,latest,'ING-afschrift (CSV)');
}
function commitImport(rows,latest,source){
  const om=openMonth();let added=0,dup=0,old=0,auto=0,inT=0,outT=0;
  const existing=new Set(S.transactions.map(t=>t.id)),seen={},fresh=[];
  for(const r of rows){
    const key=[r.date,r2(r.amount),r.name,r.iban||'',r.desc||''].join('|');seen[key]=(seen[key]||0)+1;
    const t={id:'b-'+hash(key+'|'+seen[key]),source:'bank',date:r.date,amount:r2(r.amount),name:r.name,iban:r.iban||'',desc:r.desc||'',monthId:om.id,statement:source};
    if(t.amount>0)inT+=t.amount;else outT-=t.amount;
    if(existing.has(t.id)){dup++;continue}
    if(r.date<om.from){old++;continue}
    classify(t);if(t.kind!=='todo')auto++;
    existing.add(t.id);fresh.push(t);added++;
  }
  mutate(()=>{S.transactions.push(...fresh);if(latest){S.kas.bank=r2(latest.saldo);S.kas.bankDate=latest.date}});
  UI.txFilter=fresh.some(t=>t.kind==='todo')?'todo':'all';
  toast(`${rows.length} transacties gevonden (bij ${eur(inT)}, af ${eur(outT)}). ${added} nieuw, waarvan ${auto} automatisch herkend.`+(dup?` ${dup} stonden er al in.`:'')+(old?` ${old} vallen vóór ${fmtDate(om.from)} en zitten al in een afgesloten maand.`:''));
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('PDF-lezer kon niet laden'));document.head.appendChild(el)})}
async function pdfLib(){if(window.pdfjsLib)return window.pdfjsLib;await loadScript(PDFJS+'pdf.worker.min.js');await loadScript(PDFJS+'pdf.min.js');return window.pdfjsLib}
async function pdfLines(buf){
  const lib=await pdfLib();const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true}).promise;
  const lines=[];
  for(let n=1;n<=doc.numPages;n++){const page=await doc.getPage(n);const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0})).sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;for(const it of items){if(cur&&Math.abs(cur.y-it.y)<=2.5)cur.items.push(it);else{cur={y:it.y,items:[it]};lines.push(cur)}}}
  return lines.map(l=>{l.items.sort((a,b)=>a.x-b.x);let out='',end=null;for(const it of l.items){if(end!=null&&it.x-end>1.2&&!out.endsWith(' '))out+=' ';out+=it.s;end=it.x+it.w}return out.replace(/\s+/g,' ').trim()}).filter(Boolean);
}
const ING_TYPES=['iDEAL | Wero','Online bankieren','Periodieke overschrijving','Overschrijving','Incasso','Betaalautomaat','Geldautomaat','Diversen','Verzamelbetaling','Acceptgiro','Spoedopdracht','Storting','Opname','Rente','iDEAL'];
function parseINGpdf(lines){
  const startRe=/^(\d{2})-(\d{2})-(\d{4}) (.+?) ([+-]) ?(\d{1,3}(?:\.\d{3})*,\d{2})$/;
  const skipRe=/^(Afschrift |Rekeningnummer|NL\d{2} ?INGB ?\d{4} ?\d{4} ?\d{2}\b|Geboekt op|Pagina \d|ING Bank N\.V|Dit product|Op ING\.nl|Wil je persoonlijk|\d{2}[A-Z0-9]{5}-[A-Z]$)/;
  const keyRe=/^(Omschrijving|IBAN|Kenmerk|Machtiging ID|Incassant ID|Valutadatum|Datum\/Tijd|Datum|Kaartnr|Transactie|Term|RRN|Overige partij|Betreft IBAN|Periode|Factuurnr|Doorlopende incasso|Eenmalige incasso)\.?:?\s*(.*)$/;
  const txs=[];let cur=null,key=null,saldo=null,period=null;
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(!period){const pm=l.match(/(\d{2}-\d{2}-\d{4}) t\/m (\d{2}-\d{2}-\d{4})/);if(pm)period=[pm[1],pm[2]]}
    if(saldo==null&&/^Eindsaldo/.test(l)){const nx=(lines[i+1]||'').match(/^(-?\d{1,3}(?:\.\d{3})*,\d{2})/);if(nx)saldo=parseAmount(nx[1])}
    if(skipRe.test(l))continue;
    const m=l.match(startRe);
    if(m){let head=m[4].trim();for(const ty of ING_TYPES)if(head.endsWith(' '+ty)){head=head.slice(0,-ty.length).trim();break}
      cur={date:`${m[3]}-${m[2]}-${m[1]}`,name:head,amount:(m[5]==='-'?-1:1)*parseAmount(m[6]),desc:[],iban:''};txs.push(cur);key=null;continue}
    if(!cur)continue;
    const k=l.match(keyRe);
    if(k){key=k[1];const v=k[2].trim();if(key==='Omschrijving'){if(v)cur.desc.push(v)}else if(key==='IBAN')cur.iban=v.replace(/\s/g,'').toUpperCase();else if(key==='Periode'||key==='Factuurnr')cur.desc.push(key+' '+v);continue}
    if(key==='Omschrijving'||key===null)cur.desc.push(l);
  }
  const iso=d=>d.split('-').reverse().join('-');
  return {period,saldo,txs:txs.map(t=>({...t,desc:t.desc.join(' ').replace(/\b(RSM[0-9a-f]{8,}|\d{10,})\b/gi,'').replace(/\s+/g,' ').trim()})),end:period?iso(period[1]):null};
}
async function importPDF(buf){
  UI.toast={text:'Afschrift wordt gelezen…'};render();
  try{const r=parseINGpdf(await pdfLines(buf));
    if(!r.txs.length)return toast('Ik vind geen transacties in deze PDF. Is het een afschrift van ING?',true);
    commitImport(r.txs,r.saldo!=null&&r.end?{date:r.end,saldo:r.saldo}:null,'ING-afschrift'+(r.period?' '+r.period.join(' t/m '):''));
  }catch(e){toast('De PDF kon niet gelezen worden ('+((e&&e.message)||e)+'). Probeer het afschrift als CSV te downloaden.',true)}
}

/* ---------- maandoverzicht als PDF ---------- */
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/';
async function pdfMaker(){
  if(!window.jspdf)await loadScript(JSPDF+'jspdf/2.5.1/jspdf.umd.min.js');
  return window.jspdf.jsPDF;
}
// Opmaak als een officieel financieel overzicht: genummerde rubrieken, inspringende regels,
// stippellijnen naar drie bedragkolommen (regel, subtotaal, totaal) en een sluitende saldoberekening.
async function maakPDF(pid,m){
  const p=P(pid),b=bill(m.id)[pid];if(!p||!b)return null;
  const jsPDF=await pdfMaker();
  // De standaardletters van een PDF kennen het lange minteken niet.
  const E=n=>eur(n).replace('−','- '),T=x=>String(x==null?'':x).replace(/−/g,'-');
  const i=S.months.indexOf(m),prevTo=i>0?S.months[i-1].to:addDays(m.from,-1);
  const doc=new jsPDF({unit:'mm',format:'a4'}),W=doc.internal.pageSize.getWidth(),L=18,R=W-18;
  const NAVY=[42,77,130],INK=[33,30,26],GRIJS=[120,112,100],LIJN=[200,192,175],PAPIER=[246,243,235];
  const K1=R-50,K2=R-25,K3=R; // rechterkanten: regel, subtotaal, totaal
  const kleur=c=>doc.setTextColor(...c),font=(st,sz)=>{doc.setFont('helvetica',st);doc.setFontSize(sz)};
  let y=0,pagina=1;
  const kop=()=>{font('normal',8);kleur(GRIJS);doc.text(T(`${S.house.name||'Huis'} · Huisrekening ${m.label.toLowerCase()} · ${p.name}`),L,12);
    doc.setDrawColor(...LIJN);doc.setLineWidth(0.2);doc.line(L,14,R,14);y=22};
  const ruimte=h=>{if(y+h>272){doc.addPage();pagina++;kop()}};
  const stippel=(x1,x2,yy)=>{if(x2-x1<4)return;doc.setDrawColor(...LIJN);doc.setLineWidth(0.25);doc.setLineDashPattern([0.4,1.1],0);doc.line(x1,yy,x2,yy);doc.setLineDashPattern([],0)};
  // Eén regel: tekst op inspringniveau, stippellijn naar het bedrag in kolom k.
  const regel=(tekst,bedrag,{in:ins=0,k=K3,vet=false,sz=9.5,c=INK,toel=null,nr=null}={})=>{
    const x=L+8+ins*7,breed=(bedrag!=null?k-28:R)-x;
    font('italic',7.5);const toelStukken=toel?doc.splitTextToSize(T(toel),breed-2):[];
    font(vet?'bold':'normal',sz);const stukken=doc.splitTextToSize(T(tekst),breed);
    ruimte(stukken.length*4.6+toelStukken.length*3.6+1.5);
    if(nr!=null){font('bold',sz);kleur(NAVY);doc.text(String(nr),L,y)}
    font(vet?'bold':'normal',sz);kleur(c);doc.text(stukken,x,y);
    const laatste=y+(stukken.length-1)*4.6;
    if(bedrag!=null){const tb=E(bedrag),bw=doc.getTextWidth(tb);
      stippel(x+doc.getTextWidth(stukken[stukken.length-1])+2,k-bw-2,laatste);doc.text(tb,k,laatste,{align:'right'})}
    y=laatste+4.6;
    if(toelStukken.length){font('italic',7.5);kleur(GRIJS);doc.text(toelStukken,x+2,y-1.2);y+=toelStukken.length*3.6}
  };
  const streep=(k,dubbel)=>{doc.setDrawColor(...INK);doc.setLineWidth(0.25);doc.line(k-24,y-3.2,k,y-3.2);if(dubbel)doc.line(k-24,y-2.4,k,y-2.4)};
  const rubriek=(nr,titel)=>{ruimte(16);y+=3;doc.setFillColor(...PAPIER);doc.rect(L-2,y-5,R-L+4,7.5,'F');
    font('bold',10.5);kleur(NAVY);doc.text(String(nr),L,y);doc.text(T(titel),L+8,y);y+=8};

  // Voorblad-kop
  doc.setFillColor(...NAVY);doc.rect(0,0,W,4,'F');
  font('normal',8.5);kleur(GRIJS);doc.text(T((S.house.name||'Huis').toUpperCase()+'  ·  HUISREKENING'),L,16);
  font('bold',21);kleur(NAVY);doc.text('Rekeningoverzicht',L,26);
  font('normal',13);kleur(INK);doc.text(T(m.label),L,33);
  // Gegevensblok
  const vak=[['Naam',p.name],['Periode',`${fmtDate(m.from)} t/m ${fmtDate(m.to)}`],['Status',m===openMonth()?'Huidige maand':'Eerdere maand'],['Momentopname van',new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})]];
  doc.setDrawColor(...LIJN);doc.setLineWidth(0.3);doc.rect(L,40,R-L,24);
  vak.forEach(([k,v],ix)=>{const x=L+4+(ix%2)*((R-L)/2),yy=46+Math.floor(ix/2)*10;font('normal',7.5);kleur(GRIJS);doc.text(k.toUpperCase(),x,yy);font('bold',10);kleur(INK);doc.text(T(v),x,yy+4.6)});
  y=74;
  // Kolomkoppen
  font('bold',7);kleur(GRIJS);[[K1,'REGEL'],[K2,'SUBTOTAAL'],[K3,'TOTAAL']].forEach(([k,t])=>doc.text(t,k,y,{align:'right'}));y+=3;

  // 1 Beginsaldo
  rubriek(1,'Beginsaldo');
  regel(`Saldo per ${fmtDate(prevTo)} (overgenomen uit vorige maand)`,b.start,{k:K3});
  for(const x of eerdereAanpassingen(pid,m))regel(`waarvan aangepast in ${x.m.label.toLowerCase()}`,x.d,{in:1,k:K2,sz:8.5,c:GRIJS,toel:x.posten.map(y=>`${y.label} ${y.d>0?'+':''}${E(y.d)}`).join(' · ')});

  // 2 Kosten
  rubriek(2,'Kosten in deze periode');
  const groups={};for(const l of b.lines)(groups[l.cat]=groups[l.cat]||[]).push(l);
  const letters='abcdefghijklmnopqrstuvwxyz';let gi=0;
  for(const [cat,ls] of Object.entries(groups)){
    const lt=letters[gi++]||'';
    if(ls.length===1&&ls[0].label===cat){regel(`${lt}  ${cat}`,ls[0].amount,{in:0,k:K2,toel:ls[0].how||null});continue}
    regel(`${lt}  ${cat}`,null,{vet:true});
    for(const l of ls)regel(l.label,l.amount,{in:1,k:K1,toel:l.how||null});
    streep(K1);y+=0.6;regel(`Subtotaal ${cat.toLowerCase()}`,sum(ls.map(l=>l.amount)),{in:1,k:K2,c:GRIJS});y+=1;
  }
  if(!b.lines.length)regel('Geen kosten in deze periode',0,{k:K2});
  streep(K2);y+=0.6;regel('Totaal kosten',sum(b.lines.map(l=>l.amount)),{vet:true,k:K3});

  // 3 Betalingen
  rubriek(3,'Ontvangen betalingen');
  if(b.payments&&b.payments.length){for(const x of b.payments)regel(`${fmtDate(x.date)}   ${x.note||'Betaling'}`,x.amount,{in:0,k:K2});streep(K2);y+=0.6}
  else if(b.paid){regel('Betalingen in deze periode',b.paid,{k:K2});streep(K2);y+=0.6}
  else regel('Geen betalingen ontvangen in deze periode',null,{c:GRIJS});
  regel('Totaal ontvangen',b.paid,{vet:true,k:K3});

  // 4 Saldoberekening
  rubriek(4,'Berekening eindsaldo');
  regel('Beginsaldo (rubriek 1)',b.start,{k:K3});
  regel('Bij: kosten (rubriek 2)',sum(b.lines.map(l=>l.amount)),{k:K3});
  regel('Af: ontvangen betalingen (rubriek 3)',-b.paid,{k:K3});
  streep(K3);y+=1;
  regel(`Eindsaldo per ${fmtDate(m.to)}`,b.end,{vet:true,sz:11,k:K3,c:NAVY});
  streep(K3,true);y+=1;
  const sc=HOUSE.includes(p.status)?sanctionFor(b.end):null;

  // 5 Betaalinstructie
  rubriek(5,b.end>0.005?'Te betalen':b.end<-0.005?'Tegoed':'Afrekening');
  ruimte(30);
  const tekst=b.end>0.005?[`Maak ${E(b.end)} over naar de huisrekening:`,`IBAN  ${S.house.iban||'-'}`,S.house.tav?`t.a.v.  ${S.house.tav}`:'',`Omschrijving  Huisrekening ${p.name}`].filter(Boolean)
    :b.end<-0.005?[`Je hebt een tegoed van ${E(-b.end)}.`,'Dit wordt automatisch verrekend met de volgende maand.']:['Je saldo staat op nul. Er hoeft niets betaald te worden.'];
  if(sc)tekst.push(`Let op: je saldo valt in de categorie "${sc.label}".`);
  const h=tekst.length*5.4+1;doc.setDrawColor(...NAVY);doc.setLineWidth(0.5);doc.line(L,y-3,L,y-3+h);
  tekst.forEach((t,ix)=>{font(ix===0?'bold':'normal',ix===0?10.5:9.5);kleur(ix===0?INK:ix===tekst.length-1&&sc?[160,40,40]:INK);doc.text(T(t),L+5,y+1.5+ix*5.4)});
  y+=h+2;

  // Voettekst op elke pagina
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){doc.setPage(k);doc.setDrawColor(...LIJN);doc.setLineWidth(0.2);doc.line(L,284,R,284);font('normal',7.5);kleur(GRIJS);
    doc.text(T('Momentopname van de huisrekening; latere aanpassingen kunnen de bedragen nog veranderen. Vragen? Neem contact op met de beheerder.'),L,288.5);
    doc.text(`Pagina ${k} van ${n}`,R,288.5,{align:'right'})}
  const naam=`Huisrekening ${m.label} ${p.name}`.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-');
  return {doc,naam};
}
async function exportPDF(pid,m){
  let r;try{r=await maakPDF(pid,m)}catch(e){return toast('De PDF-maker kon niet laden. Controleer je internetverbinding en probeer het opnieuw.',true)}
  if(!r)return;const {doc,naam}=r;
  // Op een telefoon via het deelmenu (bewaren in Bestanden, doorsturen); anders gewoon downloaden.
  const file=new File([doc.output('blob')],naam+'.pdf',{type:'application/pdf'});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:naam});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  doc.save(naam+'.pdf');
}

/* ---------- oude maand uit Excel ---------- */
// Leest het oude Excel-bestand (bladen Huischgenoten, Huislasten, Servicekosten, Extra Correctie,
// Maandoverzicht Pilsrekening, Betalingen en OHs & Onderhuur) en maakt er een afgesloten maand van.
function xlsMaand(wb){
  const X=window.XLSX,blad=n=>{const k=wb.SheetNames.find(x=>normNaam(x)===normNaam(n));return k?X.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:null,raw:true}):null};
  const num=v=>typeof v==='number'?v:(typeof v==='string'&&/^-?[\d.,]+$/.test(v.trim())?+v.replace(/\./g,'').replace(',','.'):0);
  const hg=blad('Huischgenoten');if(!hg)throw new Error('blad "Huischgenoten" ontbreekt');
  // Periode uit Betalingen ("24-08-2026 t/m 25-09-2026"); de maand is die van de einddatum.
  const bt=blad('Betalingen')||[];let from=null,to=null;
  for(const r of bt)for(const c of r||[]){const mm=String(c||'').match(/(\d{1,2})-(\d{1,2})-(\d{4})\s*t\/m\s*(\d{1,2})-(\d{1,2})-(\d{4})/);
    if(mm&&!from){const d=(a,b,c)=>`${c}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;from=d(mm[1],mm[2],mm[3]);to=d(mm[4],mm[5],mm[6])}}
  if(!to)throw new Error('de periode (bijv. "24-08-2026 t/m 25-09-2026") staat niet op het blad Betalingen');
  const [y,mo]=to.split('-').map(Number),id=`${y}-${String(mo).padStart(2,'0')}`,label=MONTHS[mo-1][0].toUpperCase()+MONTHS[mo-1].slice(1)+' '+y;
  const hRij=hg.findIndex(r=>(r||[]).some(c=>normNaam(c)==='saldo oud'));if(hRij<0)throw new Error('kolom "Saldo Oud" niet gevonden op Huischgenoten');
  const H=hg[hRij].map(normNaam),kol=n=>H.indexOf(n);
  const k={oud:kol('saldo oud'),bank:kol('bank'),kas:kol('kas'),pils:kol('pilsrekening'),hl:kol('huislasten'),sc:kol('servicekosten correctie'),ec:kol('extra correctie'),rek:kol('rekening')};
  const naamKol=k.oud-1,personen=[];
  for(const r of hg.slice(hRij+1)){const n=r&&r[naamKol];if(!n||/^totaal/i.test(String(n)))break;personen.push({naam:String(n).trim(),r})}
  // Detailregels per persoon uit een blad met kopregel en personen eronder.
  const detail=(rijen,kopTest,overslaan)=>{const out={};if(!rijen)return out;
    const ki=rijen.findIndex(kopTest);if(ki<0)return out;const kop=rijen[ki];
    for(const r of rijen.slice(ki+1)){const nk=r&&r.findIndex(c=>typeof c==='string'&&personen.some(p=>normNaam(p.naam)===normNaam(c)));if(nk==null||nk<0)continue;
      const nm=normNaam(r[nk]),cel=out[nm]=out[nm]||[];
      kop.forEach((h,i)=>{if(i<=nk||h==null||overslaan(normNaam(h)))return;const v=num(r[i]);if(Math.abs(v)>0.00001)cel.push({label:String(h).trim(),i,amount:v})})}
    return {out,kop,ki,rijen}};
  const kolTot=(d,i)=>{let t=0,n=0;for(const nm in d.out)for(const c of d.out[nm])if(c.i===i){t+=c.amount;n++}return {t,n}};
  const hl=detail(blad('Huislasten'),r=>(r||[]).some(c=>normNaam(c)==='rekening')&&(r||[]).some(c=>normNaam(c)==='totaal vast'),h=>['aantal maanden','totaal vast','totaal variabel','rekening'].includes(h));
  const ecB=blad('Extra Correctie'),ec=detail(ecB,r=>(r||[]).some(c=>normNaam(c)==='totaal')&&(r||[]).some(c=>normNaam(c)==='uitgaven'),h=>h==='totaal'||h==='uitgaven');
  const pi=detail(blad('Maandoverzicht Pilsrekening'),r=>(r||[]).some(c=>normNaam(c)==='totale kosten'),h=>h==='totale kosten');
  let flesPrijs=0;for(const r of blad('Maandoverzicht Pilsrekening')||[])if(r&&normNaam(r[1])==='pils fles'&&typeof r[2]==='number')flesPrijs=r[2];
  const scB=blad('Servicekosten')||[],scKop=(scB[0]||[]).map(normNaam),sk=n=>scKop.indexOf(n);
  const scRij=nm=>scB.find(r=>r&&normNaam(r[sk('wie ingeschreven')])===nm);
  const regels=[];
  for(const {naam,r} of personen){const nm=normNaam(naam),lines=[];
    const posten=(d,cat,how)=>{for(const c of (d.out&&d.out[nm])||[])lines.push({cat,label:c.label,amount:c.amount,how:how(c)})};
    posten(hl,'Huislasten',c=>{if(normNaam(c.label)==='sparen')return 'vast bedrag per persoon';const {t,n}=kolTot(hl,c.i);return `${eur(t)} ÷ ${n} personen`});
    posten(pi,'Pils',c=>normNaam(c.label)==='pils fles'&&flesPrijs?`${Math.round(c.amount/flesPrijs)} flesjes × ${eur3(flesPrijs)}`:'uit de oude pilsrekening');
    posten(ec,'Extra correctie',c=>{const {t,n}=kolTot(ec,c.i);return `${eur(t)} ÷ ${n} personen`});
    const scBedrag=num(r[k.sc]);
    if(Math.abs(scBedrag)>0.00001){const x=scRij(nm);
      lines.push({cat:'Servicekosten',label:'Servicekosten-correctie',amount:scBedrag,how:x?`gemiddeld ${eur(num(x[sk('gemiddelde servicekosten')]))} − kamer ${eur(num(x[sk('servicekosten')]))} − correctie kale huur ${eur(num(x[sk('correctie kale huur')]))} + Money Underdogs ${eur(num(x[sk('money underdogs')]))}`:'uit de oude Excel'})}
    // Wat de detailbladen niet verklaren (afronding) komt als losse regel, zodat het saldo exact klopt.
    for(const [cat,kk] of [['Huislasten','hl'],['Pils','pils'],['Extra correctie','ec']]){const totaal=num(r[k[kk]]),som=sum(lines.filter(l=>l.cat===cat).map(l=>l.amount));
      if(Math.abs(totaal-som)>0.005)lines.push({cat,label:som?'Afronding / overig':cat,amount:totaal-som,how:'volgens het totaal in de oude Excel'})}
    const start=num(r[k.oud]),bank=num(r[k.bank]),kas=k.kas>=0?num(r[k.kas]):0,paid=bank+kas;
    const end=k.rek>=0&&typeof r[k.rek]==='number'?r[k.rek]:start-paid+sum(lines.map(l=>l.amount));
    const payments=[];if(bank)payments.push({date:to,amount:bank,note:'Betalingen bank (oude Excel)'});if(kas)payments.push({date:to,amount:kas,note:'Betalingen kas (oude Excel)'});
    const charges=sum(lines.map(l=>l.amount));
    if(Math.abs(start-paid+charges-end)>0.005)lines.push({cat:'Overig',label:'Verschil volgens de oude Excel',amount:end-(start-paid+charges),how:'volgens het eindsaldo in de oude Excel'});
    regels.push({naam,huis:true,b:{start:r2(start),paid:r2(paid),end:r2(end),lines,payments}})}
  // Oud-huisgenoten en onderhuurders: saldo oud, afbetaald, rekening en nieuw saldo per kolom.
  const oh=blad('OHs & Onderhuur');
  if(oh){const nr=oh[1]||[],rij=t=>oh.find(r=>r&&r.some(c=>normNaam(c)===t));const ro=rij('saldo oud'),ra=rij('afbetaald'),rr=rij('rekening'),rn=rij('nieuw saldo');
    nr.forEach((n,i)=>{if(i<2||!n||typeof n!=='string'||!ro||ro[i]==null)return;
      const start=num(ro[i]),paid=ra?num(ra[i]):0,rek=rr?num(rr[i]):0,end=rn&&rn[i]!=null?num(rn[i]):start-paid+rek;
      const lines=Math.abs(rek)>0.00001?[{cat:'Overig',label:'Rekening',amount:rek,how:'uit de oude Excel'}]:[];
      if(Math.abs(start-paid+rek-end)>0.005)lines.push({cat:'Overig',label:'Verschil volgens de oude Excel',amount:end-(start-paid+rek),how:'volgens het nieuwe saldo in de oude Excel'});
      regels.push({naam:n.trim(),huis:false,b:{start:r2(start),paid:r2(paid),end:r2(end),lines,payments:paid?[{date:to,amount:paid,note:'Afbetaald (oude Excel)'}]:[]}})})}
  return {id,label,from,to,regels};
}
// Koppelt een naam uit de Excel aan een persoon in de app (huisgenoten bij voorkeur, oud-huisgenoten voor het OH-blad).
function xlsPersoon(naam,huis){
  const nm=normNaam(naam),kaal=p=>normNaam(p.name.replace(/\(.*?\)/g,''));
  const pool=huis?[...S.people.filter(p=>HOUSE.includes(p.status)),...S.people.filter(p=>!HOUSE.includes(p.status))]:[...S.people.filter(p=>!HOUSE.includes(p.status)),...S.people.filter(p=>HOUSE.includes(p.status))];
  return pool.find(p=>normNaam(p.name)===nm||kaal(p)===nm)||null;
}
async function xlsImporteren(files){
  const X=window.XLSX;if(!X)return toast('De Excel-lezer is niet geladen. Herlaad de pagina en probeer het opnieuw.',true);
  const maanden=[];
  for(const f of files){try{const wb=X.read(await f.arrayBuffer(),{type:'array'});maanden.push(xlsMaand(wb))}catch(e){return toast(`${f.name} kon niet gelezen worden: ${e.message||e}`,true)}}
  maanden.sort((a,b)=>a.id.localeCompare(b.id));
  const dubbel=maanden.filter(x=>S.months.some(m=>m.id===x.id&&!m.closed));
  if(dubbel.length)return toast(`${dubbel.map(x=>x.label).join(', ')} is de lopende maand en kan niet overschreven worden.`,true);
  const bestaat=maanden.filter(x=>S.months.some(m=>m.id===x.id));
  const nieuwePers=new Set();for(const x of maanden)for(const g of x.regels)if(!xlsPersoon(g.naam,g.huis))nieuwePers.add(g.naam);
  // Sluit het eindsaldo aan op het beginsaldo van de maand erna (al in de app of ook geïmporteerd)?
  const tekst=maanden.map(x=>{const na=[...S.months.filter(m=>m.id>x.id&&m.snapshot).map(m=>({id:m.id,label:m.label,snap:m.snapshot})),...maanden.filter(y=>y.id>x.id).map(y=>({id:y.id,label:y.label,regels:y.regels}))].sort((a,b)=>a.id.localeCompare(b.id))[0];
    let aansl='';if(na){let n=0,t=0;for(const g of x.regels){const p=xlsPersoon(g.naam,g.huis);if(!p)continue;
      const st=na.snap?(na.snap[p.id]||{}).start:((na.regels.find(h=>xlsPersoon(h.naam,h.huis)===p)||{}).b||{}).start;if(st==null)continue;t++;if(Math.abs(st-g.b.end)>0.01)n++}
      aansl=n?` Let op: bij ${n} van de ${t} personen sluit het eindsaldo niet aan op het beginsaldo van ${na.label.toLowerCase()}.`:` Sluit aan op ${na.label.toLowerCase()}.`}
    return `${x.label} (${fmtDate(x.from)} t/m ${fmtDate(x.to)}): ${x.regels.length} personen, samen ${eur(sum(x.regels.map(g=>g.b.end)))} open.${aansl}`}).join(' ');
  ask(`${tekst}${bestaat.length?` ${bestaat.map(x=>x.label).join(', ')} staat al in de app en wordt vervangen.`:''}${nieuwePers.size?` Nieuwe personen (als oud-huisgenoot): ${[...nieuwePers].join(', ')}.`:''} Importeren?`,'Importeren',()=>mutate(()=>{
    for(const x of maanden){const snap={};
      for(const g of x.regels){let p=xlsPersoon(g.naam,g.huis);
        if(!p){p={id:uid('p'),name:g.naam,status:'oud'};S.people.push(p)}
        snap[p.id]={...g.b,lines:g.b.lines.map(l=>({cat:l.cat,label:l.label,amount:Math.round(l.amount*10000)/10000,how:l.how||'',ref:null}))}}
      const m={id:x.id,label:x.label,from:x.from,to:x.to,closed:true,snapshot:snap,note:'Overgenomen uit de oude Excel'};
      const i=S.months.findIndex(y=>y.id===x.id);if(i>=0)S.months[i]=m;else{S.months.push(m);S.months.sort((a,b)=>a.id.localeCompare(b.id))}
    }
    UI.month=maanden[maanden.length-1].id;
    toast(`${maanden.map(x=>x.label).join(' en ')} geïmporteerd.`);
  }));
}

function addMonthId(id,n){let [y,m]=id.split('-').map(Number);m+=n;while(m>12){m-=12;y++}return `${y}-${String(m).padStart(2,'0')}`}
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function addMonthDate(d){const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+1);return x.toISOString().slice(0,10)}
function closeMonth(naarNieuw){
  const m=openMonth();const B=bill(m.id);
  const snap={};for(const id in B){const b=B[id];snap[id]={start:r2(b.start),paid:r2(b.paid),end:r2(b.end),lines:b.lines.map(l=>({cat:l.cat,label:l.label,amount:Math.round(l.amount*10000)/10000,how:l.how||'',ref:l.ref||null})),payments:b.payments}}
  UI.month=m.id;zetMaandCfg();
  mutate(()=>{
    // De maand blijft aanpasbaar; hij krijgt alleen eigen instellingen en een momentopname voor de geschiedenis.
    m.closed=true;m.snapshot=snap;m.cfg=JSON.parse(JSON.stringify(Object.fromEntries(CFG_KEYS.map(k=>[k,S[k]]))));
    if(m.pils)m.pils.prices={bp:barPrice(),fp:flesPrice(),fust20:+PS().fust20Price,fust50:+PS().fust50Price,krat:+PS().kratPrice,plex:+PS().plexPrice,gas:+PS().gasPrice};
    const nid=addMonthId(m.id,1),[y,mm]=nid.split('-').map(Number);
    S.months.push({id:nid,label:MONTHS[mm-1][0].toUpperCase()+MONTHS[mm-1].slice(1)+' '+y,from:addDays(m.to,1),to:addMonthDate(m.to),closed:false,includeService:m.includeService!==false,pils:emptyPils(m.pils)});
    for(const t of S.transactions)if(t.monthId===m.id&&t.kind==='todo')t.monthId=nid;
    UI.month=naarNieuw?nid:m.id;
  });
  toast(naarNieuw?`${openMonth().label} is aangemaakt. De eindsaldo's van ${m.label.toLowerCase()} zijn de beginsaldo's; ${m.label.toLowerCase()} blijft gewoon aanpasbaar.`:`${openMonth().label} is begonnen.`+(BE?'':' Klik op Opslaan en delen om de rekening te publiceren.'));
}
function reopenMonth(){
  const om=openMonth(),i=S.months.indexOf(om),last=S.months[i-1];
  mutate(()=>{
    for(const t of S.transactions)if(t.monthId===om.id)t.monthId=last.id;
    for(const e of S.events)if(e.billMonth===om.id)e.billMonth=last.id;
    S.months.splice(i,1);last.closed=false;delete last.snapshot;if(last.pils)delete last.pils.prices;UI.month=last.id;
  });
}

async function save(auto){

    // Focus en cursor bewaren: render() bouwt de pagina opnieuw op terwijl je misschien al verder typt.
    const actief=document.activeElement,focusId=actief&&actief.id;
    const herstelFocus=()=>{if(!focusId)return;const x=document.getElementById(focusId);if(x&&x!==document.activeElement){const sel=actief.selectionStart;x.focus();try{if(sel!=null)x.setSelectionRange(sel,sel)}catch(_){}}};
    const n=UI.wijzigingen||0,prev=S.rev||0;
    UI.saving=true;if(!auto){render();herstelFocus()}
    S.savedAt=new Date().toISOString();
    try{let kopie;metGlobaal(()=>{kopie=JSON.parse(JSON.stringify(S))});const r=await BE.save(kopie,prev);S.rev=(r&&r.rev)||prev+1;UI.saving=false;
      // Tijdens het opslaan opnieuw gewijzigd? Dan blijft het concept staan en volgt er nog een opslag.
      if((UI.wijzigingen||0)===n){UI.dirty=false;store.del(DRAFT)}else{saveDraft();autoSave()}
      if(!auto)toast('Opgeslagen. Iedereen ziet nu de nieuwe stand.')}
    catch(e){UI.saving=false;
      if(e&&e.code==='conflict'){
        // Elders (ander tabblad of apparaat) is intussen opgeslagen. Jouw versie is de meest recente bewerking:
        // haal het nieuwe versienummer op en sla daarop opnieuw op.
        UI.conflicten=(UI.conflicten||0)+1;
        if(UI.conflicten<=3)try{const r=await BE.load();S.rev=r.rev;UI.opslagFout=null;return save(auto)}catch(e2){}
        UI.opslagFout='conflict';UI.conflicten=0}
      else if(e&&e.code==='not_writer'){UI.autoStop=true;UI.editor=false;UI.barman=false;toast('Je hebt geen beheerdersrechten voor de huisrekening.',true)}
      else{UI.opslagFout=(e&&e.message)||String(e);UI.pogingen=(UI.pogingen||0)+1;autoSave(Math.min(30000,3000*UI.pogingen))}
      saveDraft();render();herstelFocus();return}
    UI.opslagFout=null;UI.pogingen=0;UI.conflicten=0;UI.opgeslagenOp=Date.now();
    render();herstelFocus();return}
  if(!ART){toast(UI.local?'Dit is een lokale kopie. Opslaan werkt alleen in de versie op claude.ai.':'Opslaan is in deze weergave niet beschikbaar. Open de huisrekening op claude.ai.',true);return}
  UI.saving=true;render();
  S.rev=(S.rev||0)+1;S.savedAt=new Date().toISOString();
  try{await ART.publish(buildDocument());store.del(DRAFT)}
  catch(e){S.rev--;UI.saving=false;const c=e&&e.code;
    if(c==='conflict'){toast('Iemand anders heeft net opgeslagen. De pagina laadt de nieuwste versie; jouw wijzigingen staan nog als concept klaar.',true)}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){UI.editor=false;store.del('huis.edit');toast('Je hebt geen bewerkrechten op deze huisrekening. De eigenaar kan je via het Delen-menu als bewerker toevoegen.',true)}
    else if(c==='rate_limited'){toast('Even te vaak opgeslagen. Wacht een minuut en probeer het opnieuw.',true)}
    else toast('Opslaan is mislukt ('+(c||'onbekend')+'). Probeer het zo nog eens; je wijzigingen staan als concept klaar.',true);
    render()}
}

function markeerMij(){

  const namen=S.people.map(p=>p.name).sort((a,b)=>b.length-a.length);
  const wie=t=>{t=(t||'').trim();return namen.find(n=>t===n||t.startsWith(n+' ')||t.startsWith(n+'\n'))};
  for(const tr of document.querySelectorAll('table tbody tr')){
    const cel=[...tr.cells].slice(0,3).find(c=>wie(c.innerText)||wie((c.querySelector('input[id^="pn-"]')||{}).value));
    // Kamerindeling e.d.: een keuzelijst met jouw naam geselecteerd
    if([...tr.cells].slice(0,3).some(c=>[...c.querySelectorAll('select')].some(x=>x.value===me.id))){tr.classList.add('mij');continue}

function statementHTML(pid,m){
  const B=bill(m.id),b=B[pid];if(!b)return '';
  const i=S.months.indexOf(m),prevTo=i>0?S.months[i-1].to:addDays(m.from,-1);
  const groups={};for(const [ix,l] of b.lines.entries()){(groups[l.cat]=groups[l.cat]||[]).push([ix,l])}
  const rows=[`<tr class="bal"><td>Saldo per ${fmtDate(prevTo)}</td><td class="r num">${eur(b.start)}</td></tr>`];
  {const ea=eerdereAanpassingen(pid,m),d=sum(ea.map(a=>a.d));
    if(ea.length)rows.push(`<tr class="ln aanp"><td>Aangepast in ${esc(ea.map(a=>a.m.label.split(' ')[0].toLowerCase()).join(', '))} <button class="linkknop" data-act="aanpbekijk" data-pid="${pid}" data-mid="${m.id}">Bekijk</button></td><td class="r num">${d>0?'+':''}${eur(d)}</td></tr>`)}
  const gOpen=c=>UI.grpAll||UI.grpOpen.has(pid+'|'+c);
  const gRow=(c,label,amt,n)=>`<tr class="grp tog" data-act="grp" data-key="${esc(pid+'|'+c)}" tabindex="0" aria-expanded="${gOpen(c)}"><td><span class="chev" aria-hidden="true">${gOpen(c)?'▾':'▸'}</span>${esc(label)} <span class="muted small">(${n})</span>${meldKnop(`${P(pid).name} · ${label} (${amt})`,m)}</td><td class="r num">${amt}</td></tr>`;
  for(const [cat,ls] of Object.entries(groups)){
    rows.push(gRow(cat,cat,eur(sum(ls.map(x=>x[1].amount))),ls.length));
    if(!gOpen(cat))continue;
    for(const [ix,l] of ls){const key=pid+':'+ix,open=UI.lineOpen===key,d=hasDetail(l);
      rows.push(`<tr class="ln ${d?'has':''}" ${d?`data-act="line" data-key="${key}" tabindex="0" aria-expanded="${open}"`:''}><td>${d?`<span class="chev" aria-hidden="true">${open?'▾':'▸'}</span>`:''}${esc(l.label)}${l.how?`<span class="how">${esc(l.how)}</span>`:''}${meldKnop(`${P(pid).name} · ${l.cat}: ${l.label} (${eur(l.amount)})`,m)}</td><td class="r num">${eur(l.amount)}</td></tr>`);
      if(open)rows.push(`<tr class="det"><td colspan="2">${lineDetail(l,pid,m)}</td></tr>`)}
  }
  if(!b.lines.length)rows.push(`<tr class="grp"><td>Nieuwe kosten</td><td class="r num">${eur(0)}</td></tr>`);
  rows.push(gRow('__pay','Betalingen',eur(-b.paid),(b.payments||[]).length||(b.paid?1:0)));
  if(!gOpen('__pay')){}
  else if(b.payments&&b.payments.length)for(const x of b.payments)rows.push(`<tr class="ln"><td>${fmtDate(x.date)}${x.note?` · ${esc(x.note)}`:''}${meldKnop(`${P(pid).name} · betaling ${fmtDate(x.date)} (${eur(x.amount)})`,m)}</td><td class="r num credit">${eur(-x.amount)}</td></tr>`);
  else if(b.paid)rows.push(`<tr class="ln"><td>Betalingen deze periode</td><td class="r num credit">${eur(-b.paid)}</td></tr>`);
  else rows.push(`<tr class="ln"><td class="muted">Geen betalingen ontvangen</td><td></td></tr>`);
  rows.push(`<tr class="bal end"><td>Saldo per ${fmtDate(m.to)}${b.end>0.005?' · te betalen':b.end<-0.005?' · tegoed':''}</td><td class="r num ${b.end<0?'credit':''}">${eur(b.end)}</td></tr>`);
  return `<div class="row end" style="margin-bottom:4px"><button class="ghost" data-act="pdf" data-id="${pid}">Download PDF</button><button class="ghost" data-act="grpall">${UI.grpAll?'Alles inklappen':'Alles uitklappen'}</button></div><div class="scroll"><table class="stmt">${rows.join('')}</table></div>`;
}

function lineMatrix(m,filter,o){
  const B=bill(m.id),cols=[],rows=[];
  for(const p of S.people){const b=B[p.id];if(!b)continue;const ls=b.lines.filter(filter);if(!ls.length)continue;
    const cells={};let cnt=null;for(const l of ls){if(!cols.includes(l.label))cols.push(l.label);cells[l.label]=(cells[l.label]||0)+l.amount;
      if(o.count&&l.label===o.count.label){const mm=(l.how||'').match(o.count.re);if(mm)cnt=(cnt||0)+(+mm[1])}}
    rows.push({p,cells,cnt})}
  if(!cols.length)return o.empty?`<section class="block"><h2>${o.title}</h2><div class="empty">${o.empty}</div></section>`:'';
  rows.sort((a,b)=>byName(a.p,b.p));
  const colTot=c=>sum(rows.map(r=>r.cells[c]||0)),hc=cols.length+(o.count?1:0)>6?'c':'r wrap';
  return `<section class="block"><h2>${o.title}</h2>${o.note?`<p class="note">${o.note}</p>`:''}
    <div class="scroll tbl"><table class="matrix"><thead><tr><th class="n">Naam</th>${o.count?`<th class="${hc}">${esc(o.count.title)}</th>`:''}${cols.map(c=>`<th class="${hc}">${esc(c)}</th>`).join('')}<th class="r">Totaal</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="n">${esc(r.p.name)}</td>${o.count?`<td class="r num">${r.cnt??'<span class="muted">—</span>'}</td>`:''}${cols.map(c=>`<td class="r num">${r.cells[c]?eur(r.cells[c]):'<span class="muted">—</span>'}</td>`).join('')}<td class="r num"><b>${eur(sum(Object.values(r.cells)))}</b></td></tr>`).join('')}
      <tr class="total"><td class="n">Totaal</td>${o.count?`<td class="r num">${sum(rows.map(r=>r.cnt||0))}</td>`:''}${cols.map(c=>`<td class="r num">${eur(colTot(c))}</td>`).join('')}<td class="r num">${eur(sum(cols.map(colTot)))}</td></tr>
    </tbody></table></div></section>`;
}
function correctieMatrix(m){
  return lineMatrix(m,l=>l.cat==='Extra correctie',{title:`Verdeling ${esc(m.label.toLowerCase())}`,note:`Wat iedereen per kopje betaalt in ${esc(m.label.toLowerCase())}, zoals in het oude Excel-blad Extra Correctie.`,empty:`Er staan nog geen extra correcties op de rekening van ${esc(m.label.toLowerCase())}.`});
}
const isHL=l=>!['Extra correctie','Pils','Servicekosten','Correctie'].includes(l.cat);
function hlPosts(mid){
  const B=bill(mid),posts={};
  for(const p of S.people){const b=B[p.id];if(!b)continue;for(const l of b.lines)if(isHL(l)){const key=l.cat+'|'+l.label;
    const x=posts[key]=posts[key]||{label:l.label,cat:l.cat,total:0,n:0,per:new Set(),ref:l.ref,how:l.how};x.total+=l.amount;x.n++;x.per.add(r2(l.amount))}}
  return Object.values(posts);
}
function hlMonthTotal(h,mid){
  if(h.type==='pp')return (+h.amountPP||0)*h.payers.filter(id=>P(id)).length;
  return sum(S.transactions.filter(t=>t.monthId===mid&&t.kind==='cost'&&t.huislastId===h.id).map(t=>-t.amount));
}
// Vaste lasten die in het afschrift terugkomen maar nog geen huislast zijn (afschrijvingen in 2+ maanden).
function hlSuggesties(){
  const g={};
  for(const t of S.transactions){if(t.kind!=='todo'||!(t.amount<0))continue;const mo=M(t.monthId);if(!mo||mo.closed)continue;
    const k=(t.name||'').toUpperCase().trim();if(!k)continue;const x=g[k]=g[k]||{name:k,months:new Set(),last:t,n:0};x.months.add(t.monthId);x.n++;if((t.date||'')>(x.last.date||''))x.last=t}
  const alle={};for(const t of S.transactions){if(!(t.amount<0))continue;const k=(t.name||'').toUpperCase().trim();(alle[k]=alle[k]||new Set()).add(t.monthId)}
  return Object.values(g).filter(x=>(alle[x.name]||x.months).size>=2).sort((a,b)=>a.name.localeCompare(b.name));
}
// Huislasten als één tabel: kolommen = huislasten (naam, totaal, soort), rijen = huisgenoten op anciënniteit.
function vHuislasten(m){
  if(UI.editor&&impMaand(m)&&m.closed)return impEdit(m,'Huislasten','Huislasten');
  const hl=S.huislasten||[],om=openMonth(),ed=UI.editor&&!vast(m),B=bill(m.id),dicht=false;
  // Wat iemand deze maand voor een huislast betaalt, uit de regels van de rekening.
  // Regels uit oude (geïmporteerde) maanden hebben geen koppeling; die herkennen we aan de naam (Prime → Amazon Prime).
  const norm=x=>String(x||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
  const opNaam=l=>{if(!isHL(l))return null;const a=norm(l.label);return hl.find(h=>norm(h.name)===a)||hl.find(h=>{const b=norm(h.name);return a&&b&&(b.includes(a)||a.includes(b))})||null};

  const regels=(lines,h)=>sum((lines||[]).filter(l=>hoort(l,h)).map(l=>l.amount));
  // Afgesloten maand: het vastgezette bedrag plus wat jouw aanpassing verandert (nu − bij openzetten).
  const bedrag=(id,h)=>{const b=dicht?(m.snapshot||{})[id]:B[id];const vastB=b?regels(b.lines.filter(l=>l.cat!=='Correctie'),h):0;
    return vastB};
  const totaal=h=>sum(Object.keys(B).map(id=>bedrag(id,h)));
  const ppl=[...S.people].sort(byName).filter(p=>UI.matrixAll||HOUSE.includes(p.status)||hl.some(h=>h.payers.includes(p.id)||Math.abs(bedrag(p.id,h))>0.004));

  const soort=h=>ed?`<select id="ht-${h.id}" data-ch="hl" data-id="${h.id}" data-f="type" aria-label="Soort"><option value="bank" ${h.type!=='pp'?'selected':''}>Bank</option><option value="pp" ${h.type==='pp'?'selected':''}>Vast p.p.</option></select>`

        :`<input id="hm-${h.id}" value="${esc(h.match||'')}" placeholder="banktekst" data-ch="hl" data-id="${h.id}" data-f="match" aria-label="Banktekst">`)
    :`<span class="small muted">${h.type==='pp'?'vast '+eur(+h.amountPP||0)+' p.p.':'bank: '+esc(h.match||'—')}</span>`;
  const cel=(p,h)=>{const v=bedrag(p.id,h),txt=Math.abs(v)>0.004?eur(v):'<span class="muted">—</span>';
    return ed?`<td class="r num"><label class="hl-cel"><input type="checkbox" id="hp-${h.id}-${p.id}" data-ch="hlpayer" data-id="${h.id}" data-pid="${p.id}" ${h.payers.includes(p.id)?'checked':''} aria-label="${esc(p.name)} betaalt ${esc(h.name)}"> ${txt}</label></td>`
      :`<td class="r num">${txt}</td>`};
  const tabel=`<div class="scroll tbl"><table class="hl-tabel"><thead>

      <tr class="hl-info"><td class="n">Vast p.p. / bank</td>${hl.map(h=>`<td class="r">${soort(h)}</td>`).join('')}<td></td></tr>
      ${ed?`<tr class="hl-info"><td class="n small muted">Snel kiezen</td>${hl.map(h=>`<td class="r"><select id="hf-${h.id}" data-ch="hlfill" data-id="${h.id}" aria-label="Snel kiezen voor ${esc(h.name)}"><option value="">…</option><option value="bewoner">Alle bewoners</option><option value="huis">Alle huisgenoten</option><option value="none">Niemand</option></select></td>`).join('')}<td></td></tr>`:''}
    </thead><tbody>
      ${ppl.map(p=>{const alle=hl.length&&hl.every(h=>h.payers.includes(p.id));

  </section>`;
}
function vService(m){

// Maanden uit de oude Excel: de rekening van die maand is leidend, op elk tabblad.
// Per post (NRC, Makro, een extra correctie, …) het totaal en wie wat betaalde; met m.impAanp[cat][post] = [personen]
// verdeel je hem opnieuw, naar verhouding van wat ieder betaalde (nieuwe betalers krijgen het gebruikelijke bedrag).
// Servicekosten (m.scAanp) en pils (m.pilsAanp) pas je per persoon aan. Het verschil loopt door in de saldo's van de maanden erna.
const impMaand=m=>!!(m&&m.snapshot&&/oude Excel/i.test(m.note||''));
const IMP_CATS=['Huislasten','Extra correctie','Pils'];
function impPosten(m,cat){
  const posts={};
  // Bij pils zijn de flesjes persoonlijk verbruik (aantal per persoon); de overige pilsposten worden gedeeld.
  for(const [id,b] of Object.entries(m.snapshot||{}))for(const l of b.lines||[])if(l.cat===cat&&!/^Aanpassing /.test(l.label)&&!(cat==='Pils'&&(l.label===FLES||l.label===TAP||(isAfkoop(l.label)&&(m.afkoopHist||[]).length)))){
    const x=posts[l.label]=posts[l.label]||{label:l.label,per:{},how:l.how};x.per[id]=(x.per[id]||0)+l.amount}
  return Object.values(posts);
}
const hlImport=m=>impPosten(m,'Huislasten');
// Aanpassing per post: { wie: [personen], vast: {persoon: bedrag}, totaal }. (Oude vorm: alleen de lijst met personen.)
function impEntry(m,cat,label){const v=((m.impAanp||{})[cat]||{})[label];return Array.isArray(v)?{wie:v}:(v||null)}
function impNieuw(m,cat,x){
  const oud=Object.keys(x.per).filter(id=>Math.abs(x.per[id])>0.00001),totOud=sum(oud.map(id=>x.per[id]));
  const A=impEntry(m,cat,x.label)||{},wie=A.wie||oud,tot=A.totaal!=null?+A.totaal:totOud;
  const vast=Object.fromEntries(Object.entries(A.vast||{}).filter(([id])=>wie.includes(id)).map(([id,v])=>[id,+v||0]));
  // Vaste bedragen eerst; het restant gaat naar de overige aangevinkten, naar verhouding van wat ze betaalden.
  const vals=oud.map(id=>x.per[id]).sort((a,b)=>a-b),gewoon=vals.length?vals[Math.floor(vals.length/2)]:0;
  const vrij=wie.filter(id=>!(id in vast)),w=Object.fromEntries(vrij.map(id=>[id,oud.includes(id)?x.per[id]:gewoon])),sw=sum(Object.values(w));
  const rest=tot-sum(Object.values(vast)),nieuw={...vast};
  for(const id of vrij)nieuw[id]=sw?rest*w[id]/sw:(vrij.length?rest/vrij.length:0);
  return {nieuw,wie,tot,totOud,oud,vast,rest};
}
function impVerschillen(m,cat){
  const out={},A=(m.impAanp||{})[cat]||{};
  for(const x of impPosten(m,cat)){if(!A[x.label])continue;const {nieuw}=impNieuw(m,cat,x),d={};
    for(const id of new Set([...Object.keys(x.per),...Object.keys(nieuw)]))d[id]=(nieuw[id]||0)-(x.per[id]||0);out[x.label]=d}
  return out;
}
// Past de aanpassing van één post aan en ruimt hem op als hij weer gelijk is aan de oorspronkelijke rekening.
function impWijzig(m,cat,label,fn){
  const x=impPosten(m,cat).find(y=>y.label===label);if(!x)return;
  const cur=impNieuw(m,cat,x),A={wie:[...cur.wie],vast:{...cur.vast},totaal:(impEntry(m,cat,label)||{}).totaal};
  fn(A,cur);
  A.wie=S.people.map(p=>p.id).filter(id=>A.wie.includes(id));
  for(const id in A.vast)if(!A.wie.includes(id))delete A.vast[id];
  if(A.totaal!=null&&Math.abs(A.totaal-cur.totOud)<0.005)A.totaal=null;
  const zelfde=A.wie.length===cur.oud.length&&A.wie.every(id=>cur.oud.includes(id))&&!Object.keys(A.vast).length&&A.totaal==null;
  const R=m.impAanp=m.impAanp||{},C2=R[cat]=R[cat]||{};
  if(zelfde)delete C2[label];else{if(!Object.keys(A.vast).length)delete A.vast;if(A.totaal==null)delete A.totaal;C2[label]=A}
  if(!Object.keys(C2).length)delete R[cat];if(!Object.keys(R).length)delete m.impAanp;
}
// Leesbare reden van een aanpassing, zodat iedereen ziet waarom zijn bedrag veranderde.
function impReden(m,cat,label){
  const x=impPosten(m,cat).find(y=>y.label===label);if(!x)return 'aangepast door de beheerder';
  const n=impNieuw(m,cat,x),nm=ids=>ids.map(id=>(P(id)||{name:id}).name).join(', '),r=[];
  const weg=n.oud.filter(id=>!n.wie.includes(id)),bij=n.wie.filter(id=>!n.oud.includes(id));
  if(weg.length)r.push(`zonder ${nm(weg)}`);if(bij.length)r.push(`met ${nm(bij)} erbij`);
  for(const [id,v] of Object.entries(n.vast))r.push(`${(P(id)||{name:id}).name} vast ${eur(v)}`);
  if(Math.abs(n.tot-n.totOud)>0.004)r.push(`totaal ${eur(n.tot)} (was ${eur(n.totOud)})`);
  return r.length?`${label} ${r.join(', ')}`:'aangepast door de beheerder';
}
function afkoopReden(m){
  const r=[];for(const x of afkoopImp(m)){if(!(m.afkoopAanp||{})[x.i])continue;const nm=ids=>ids.map(id=>(P(id)||{name:id}).name).join(', ');
    const weg=x.oud.filter(id=>!x.wie.includes(id)),bij=x.wie.filter(id=>!x.oud.includes(id));
    r.push(`afkoop ${x.a.label||''}${weg.length?` zonder ${nm(weg)}`:''}${bij.length?` met ${nm(bij)} erbij`:''}`)}
  return r.join('; ')||'aangepast door de beheerder';

// Wat er voor deze persoon in eerdere maanden veranderd is ten opzichte van de vastgelegde rekening van toen.
function eerdereAanpassingen(pid,m){
  const i=S.months.indexOf(m),out=[];
  for(const x of S.months.slice(0,i)){const sn=(x.snapshot||{})[pid];if(!sn)continue;const b=bill(x.id)[pid];if(!b)continue;
    const d=(b.end-b.start)-(sn.end-sn.start);if(Math.abs(d)<0.005)continue;
    const k=l=>l.cat+'\u0000'+l.label,nu={},oud={};
    for(const l of b.lines)nu[k(l)]=(nu[k(l)]||0)+l.amount;for(const l of sn.lines||[])oud[k(l)]=(oud[k(l)]||0)+l.amount;
    const posten=[...new Set([...Object.keys(nu),...Object.keys(oud)])].filter(kk=>Math.abs((nu[kk]||0)-(oud[kk]||0))>0.004).map(kk=>{
      const l=b.lines.find(y=>k(y)===kk),[cat,label]=kk.split('\u0000');
      return {cat,label,oud:oud[kk]||0,nu:nu[kk]||0,d:(nu[kk]||0)-(oud[kk]||0),why:l?(l.reden!=null?l.reden:l.how):''}});
    if(Math.abs(b.paid-(+sn.paid||0))>0.004)posten.push({cat:'',label:'Betalingen',oud:-(+sn.paid||0),nu:-b.paid,d:-(b.paid-(+sn.paid||0)),why:''});
    out.push({m:x,d,posten,eindOud:sn.end-sn.start+b.start,eindNu:b.end})}
  // Alleen tonen in de maand direct na de aangepaste maand en in de huidige maand.
  const vorige=S.months[i-1];return out.filter(a=>m===openMonth()||a.m===vorige);
}

function pilsHistory(){

  const rows=ms.map(m=>{let pc;if(m.closed&&m.pils.prices){const keep={...S.pilsSettings};S.pilsSettings={...keep,barPrice:m.pils.prices.bp,flesPrice:m.pils.prices.fp,fust20Price:m.pils.prices.fust20,fust50Price:m.pils.prices.fust50,kratPrice:m.pils.prices.krat,plexPrice:m.pils.prices.plex,gasPrice:m.pils.prices.gas};pc=pilsCalc(m.pils);S.pilsSettings=keep}else pc=pilsCalc(m.pils);

  <section class="block"><h2>Oude maand importeren</h2>
    <p class="note">Zet een maand uit het oude Excel-bestand van de huisrekening als afgesloten maand in de app, met per persoon alle posten, betalingen en saldo's. Je kunt meerdere bestanden tegelijk kiezen. Je krijgt eerst te zien wat er geïmporteerd wordt en of de saldo's aansluiten op de maand erna.</p>
    <div class="row"><label class="btn" for="xlsx-maand">Excel-maand importeren<input type="file" id="xlsx-maand" accept=".xlsx,.xls" multiple data-ch="xlsxmaand" hidden></label></div></section>

  <section class="block"><h2>Downloaden en back-up</h2>
    <p class="note"><b>App downloaden</b> geeft één HTML-bestand met de app en alle huidige gegevens, inclusief niet-opgeslagen wijzigingen. Stuur dat naar iemand die de app verder wil aanpassen: hij uploadt het in Claude en vraagt om wijzigingen. Een <b>back-up</b> bevat alleen de gegevens en kun je hier terugzetten.</p>
    <div class="row"><button class="primary" data-act="downloadhtml">App downloaden (HTML)</button><button data-act="backup">Back-up downloaden</button><label class="btn" for="restore-file">Back-up terugzetten<input type="file" id="restore-file" accept=".json,application/json" data-ch="restore" hidden></label></div></section>`;
}

  if(ev.target.closest('input,select,textarea,label')&&el.tagName==='TR')return;
  if(el.dataset.act==='line'&&ev.target.closest('tr.det'))return;
  acts[el.dataset.act]&&acts[el.dataset.act](el,ev)});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-ch]');if(el&&changes[el.dataset.ch])changes[el.dataset.ch](el,ev)});
// Mailtekst direct bijhouden, zodat een tussentijdse render niets wist.
document.addEventListener('input',ev=>{const el=ev.target.closest('[data-ch="mailveld"]');if(el&&UI.mail)UI.mail[el.dataset.f]=el.value;
  const md=ev.target.closest('[data-ch="meldveld"]');if(md&&UI.meld)UI.meld[md.dataset.f]=md.value;
  const ma=ev.target.closest('[data-ch="meldant"]');if(ma)(UI.antw=UI.antw||{})[ma.dataset.id]=ma.value});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&UI.confirm){UI.confirm=null;render()}
  else if(ev.key==='Escape'&&UI.meld&&!UI.meld.bezig){UI.meld=null;render()}
  else if(ev.key==='Escape'&&UI.aanpVenster){UI.aanpVenster=null;render()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-act]')){ev.preventDefault();acts[ev.target.dataset.act](ev.target)}});

/* ---------- start ---------- */
const draft=S?loadDraft():null;
async function boot(){
  render();
  if(BE){
    try{const r=await BE.load();if(!r||!r.data)throw new Error('geen gegevens gevonden');S=migrate(r.data);S.rev=r.rev??S.rev??1}
    catch(e){UI.loadMsg='De huisrekening kon niet geladen worden ('+((e&&e.message)||e)+'). Ben je ingelogd met een e-mailadres dat toegang heeft?';S=null;render();return}
    try{UI.editor=!!(await BE.canEdit())}catch(e){UI.editor=false}
    UI.beheerder=UI.editor;
    try{UI.barman=!UI.editor&&!!(BE.isBarman&&await BE.isBarman())}catch(e){UI.barman=false}
    DL={save:async({filename,data})=>{if(BE.download)await BE.download(filename,data);else browserDownload(filename,data);return {status:'saved'}}};
    UI.month=(UI.editor?openMonth():(S.months.filter(m=>m.closed).slice(-1)[0]||openMonth())).id;
    if(store.get('huis.tab'))UI.tab=store.get('huis.tab');
    const d2=loadDraft();if(magOpslaan()&&d2){S=d2;UI.dirty=true;UI.wijzigingen=1;autoSave(300)}
    billCache.clear();render();laadMeldingen();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')nuOpslaan();else verversVanServer()});
    addEventListener('pagehide',nuOpslaan);
    addEventListener('beforeunload',ev=>{nuOpslaan();if(magOpslaan()&&(UI.dirty||UI.saving)){ev.preventDefault();ev.returnValue=''}});
    setInterval(()=>{if(document.visibilityState==='visible')verversVanServer()},60000);
    return;
  }
  if(UI.local){UI.editor=true;UI.month=openMonth().id;if(draft){S=draft;UI.dirty=true}render();return}
  const [user,art,dl]=await Promise.all([claude.use('user').catch(()=>null),claude.use('artifact').catch(()=>null),claude.use('downloads').catch(()=>null)]);
  ART=art;DL=dl;
  let edit=false;try{if(user)edit=(await user.canEdit())||(await user.isOwner())}catch(e){}
  if(!edit&&store.get('huis.edit')==='1'){edit=true;UI.forced=true}
  UI.editor=edit;
  if(UI.editor)UI.month=openMonth().id;
  if(UI.editor&&draft){S=draft;billCache.clear();UI.dirty=true;toast('Je niet-opgeslagen wijzigingen zijn teruggezet.')}
  render();
}
boot();
})();
</script>
