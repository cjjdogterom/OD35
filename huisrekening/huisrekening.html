(function(){

/* ---------- datamodel bijwerken ---------- */

function parseCSV(text){
  text=text.replace(new RegExp('^'+String.fromCharCode(65279)),'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x!==''))rows.push(row);
  return rows;
}

  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}

  if(hm){t.kind='cost';t.huislastId=hm.id;t.label=hm.name;t.auto=true;return}
  const rule=S.bankRules.find(r=>r.match&&word(r.match).test(hay));

  if(rule){t.kind=rule.action==='kas'?'kas':rule.action==='voorschot'?'voorschot':'cost';t.categoryId=rule.action==='cost'?rule.categoryId||null:null;t.label=rule.label||'';if(t.kind==='voorschot')t.vsWhat=rule.label||'';t.auto=true;return}

function importING(text){

  const h=rows[0].map(x=>x.trim().toLowerCase());

  const I={date:col('datum'),name:col('naam / omschrijving','naam'),tegen:col('tegenrekening'),afbij:col('af bij','af/bij'),amt:col('bedrag (eur)','bedrag'),mut:col('mutatiesoort'),med:col('mededelingen','omschrijving'),saldo:col('saldo na mutatie','saldo')};
  if(I.date<0||I.amt<0)return toast('Ik herken de kolommen niet. Gebruik de CSV- of PDF-download van ING.',true);

  for(const r of rows.slice(1)){

    const raw=parseAmount(r[I.amt]);const af=I.afbij>=0?/^af/i.test(r[I.afbij]||''):raw<0;
    out.push({date,amount:af?-Math.abs(raw):Math.abs(raw),name:(r[I.name]||'').trim(),iban:(I.tegen>=0?(r[I.tegen]||'').replace(/\s/g,'').toUpperCase():''),

}
function commitImport(rows,latest,source){
  const om=openMonth();let added=0,dup=0,old=0,auto=0,inT=0,outT=0;
  const existing=new Set(S.transactions.map(t=>t.id)),seen={},fresh=[];
  for(const r of rows){
    const key=[r.date,r2(r.amount),r.name,r.iban||'',r.desc||''].join('|');seen[key]=(seen[key]||0)+1;
    const t={id:'b-'+hash(key+'|'+seen[key]),source:'bank',date:r.date,amount:r2(r.amount),name:r.name,iban:r.iban||'',desc:r.desc||'',monthId:om.id,statement:source};
    if(t.amount>0)inT+=t.amount;else outT-=t.amount;
    if(existing.has(t.id)){dup++;continue}
    if(r.date<om.from){old++;continue}
    classify(t);if(t.kind!=='todo')auto++;
    existing.add(t.id);fresh.push(t);added++;
  }
  mutate(()=>{S.transactions.push(...fresh);if(latest){S.kas.bank=r2(latest.saldo);S.kas.bankDate=latest.date}});
  UI.txFilter=fresh.some(t=>t.kind==='todo')?'todo':'all';

}

async function pdfLines(buf){

  const lines=[];

const ING_TYPES=['iDEAL | Wero','Online bankieren','Periodieke overschrijving','Overschrijving','Incasso','Betaalautomaat','Geldautomaat','Diversen','Verzamelbetaling','Acceptgiro','Spoedopdracht','Storting','Opname','Rente','iDEAL'];
function parseINGpdf(lines){
  const startRe=/^(\d{2})-(\d{2})-(\d{4}) (.+?) ([+-]) ?(\d{1,3}(?:\.\d{3})*,\d{2})$/;
  const skipRe=/^(Afschrift |Rekeningnummer|NL\d{2} ?INGB ?\d{4} ?\d{4} ?\d{2}\b|Geboekt op|Pagina \d|ING Bank N\.V|Dit product|Op ING\.nl|Wil je persoonlijk|\d{2}[A-Z0-9]{5}-[A-Z]$)/;
  const keyRe=/^(Omschrijving|IBAN|Kenmerk|Machtiging ID|Incassant ID|Valutadatum|Datum\/Tijd|Datum|Kaartnr|Transactie|Term|RRN|Overige partij|Betreft IBAN|Periode|Factuurnr|Doorlopende incasso|Eenmalige incasso)\.?:?\s*(.*)$/;
  const txs=[];let cur=null,key=null,saldo=null,period=null;
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(!period){const pm=l.match(/(\d{2}-\d{2}-\d{4}) t\/m (\d{2}-\d{2}-\d{4})/);if(pm)period=[pm[1],pm[2]]}
    if(saldo==null&&/^Eindsaldo/.test(l)){const nx=(lines[i+1]||'').match(/^(-?\d{1,3}(?:\.\d{3})*,\d{2})/);if(nx)saldo=parseAmount(nx[1])}
    if(skipRe.test(l))continue;
    const m=l.match(startRe);
    if(m){let head=m[4].trim();for(const ty of ING_TYPES)if(head.endsWith(' '+ty)){head=head.slice(0,-ty.length).trim();break}
      cur={date:`${m[3]}-${m[2]}-${m[1]}`,name:head,amount:(m[5]==='-'?-1:1)*parseAmount(m[6]),desc:[],iban:''};txs.push(cur);key=null;continue}
    if(!cur)continue;
    const k=l.match(keyRe);
    if(k){key=k[1];const v=k[2].trim();if(key==='Omschrijving'){if(v)cur.desc.push(v)}else if(key==='IBAN')cur.iban=v.replace(/\s/g,'').toUpperCase();else if(key==='Periode'||key==='Factuurnr')cur.desc.push(key+' '+v);continue}
    if(key==='Omschrijving'||key===null)cur.desc.push(l);
  }
  const iso=d=>d.split('-').reverse().join('-');
  return {period,saldo,txs:txs.map(t=>({...t,desc:t.desc.join(' ').replace(/\b(RSM[0-9a-f]{8,}|\d{10,})\b/gi,'').replace(/\s+/g,' ').trim()})),end:period?iso(period[1]):null};
}

  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:naam});return}catch(e){if(e&&e.name==='AbortError')return}
  }

function addMonthId(id,n){let [y,m]=id.split('-').map(Number);m+=n;while(m>12){m-=12;y++}return `${y}-${String(m).padStart(2,'0')}`}
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function addMonthDate(d){const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+1);return x.toISOString().slice(0,10)}
function closeMonth(naarNieuw){
  const m=openMonth();const B=bill(m.id);
  const snap={};for(const id in B){const b=B[id];snap[id]={start:r2(b.start),paid:r2(b.paid),end:r2(b.end),lines:b.lines.map(l=>({cat:l.cat,label:l.label,amount:Math.round(l.amount*10000)/10000,how:l.how||'',ref:l.ref||null})),payments:b.payments}}
  UI.month=m.id;zetMaandCfg();
  const metCorr=new Set(correcties().map(c=>c.m.id)),her=S.months.filter(x=>x.closed&&x.bewerkt);
  mutate(()=>{
    // De correcties staan nu in de rekening van deze maand; de oude maanden gaan weer op slot.
    for(const x of her){x.bewerkt=false;delete x.basis;delete x.basisLines;if(metCorr.has(x.id))x.gecorrigeerd=(x.gecorrigeerd||[]).concat(m.label)}
    m.closed=true;m.snapshot=snap;m.cfg=JSON.parse(JSON.stringify(Object.fromEntries(CFG_KEYS.map(k=>[k,S[k]]))));
    if(m.pils)m.pils.prices={bp:barPrice(),fp:flesPrice(),fust20:+PS().fust20Price,fust50:+PS().fust50Price,krat:+PS().kratPrice,plex:+PS().plexPrice,gas:+PS().gasPrice};
    const nid=addMonthId(m.id,1),[y,mm]=nid.split('-').map(Number);
    S.months.push({id:nid,label:MONTHS[mm-1][0].toUpperCase()+MONTHS[mm-1].slice(1)+' '+y,from:addDays(m.to,1),to:addMonthDate(m.to),closed:false,includeService:m.includeService!==false,pils:emptyPils(m.pils)});
    for(const t of S.transactions)if(t.monthId===m.id&&t.kind==='todo')t.monthId=nid;
    UI.month=naarNieuw?nid:m.id;
  });
  toast(naarNieuw?`${openMonth().label} is aangemaakt. ${m.label} is afgesloten en de eindsaldo's zijn doorgerekend als beginsaldo.`:`${m.label} is afgesloten.`+(BE?'':' Klik op Opslaan en delen om de rekening te publiceren.'));
}
function reopenMonth(){
  const om=openMonth(),i=S.months.indexOf(om),last=S.months[i-1];
  mutate(()=>{
    for(const t of S.transactions)if(t.monthId===om.id)t.monthId=last.id;
    for(const e of S.events)if(e.billMonth===om.id)e.billMonth=last.id;
    S.months.splice(i,1);last.closed=false;delete last.snapshot;if(last.pils)delete last.pils.prices;UI.month=last.id;
  });
}

const RESET_FALLBACK=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';

async function save(auto){
  if(BE){
    // Focus en cursor bewaren: render() bouwt de pagina opnieuw op terwijl je misschien al verder typt.
    const actief=document.activeElement,focusId=actief&&actief.id;
    const herstelFocus=()=>{if(!focusId)return;const x=document.getElementById(focusId);if(x&&x!==document.activeElement){const sel=actief.selectionStart;x.focus();try{if(sel!=null)x.setSelectionRange(sel,sel)}catch(_){}}};
    const n=UI.wijzigingen||0,prev=S.rev||0;
    UI.saving=true;if(!auto){render();herstelFocus()}
    S.savedAt=new Date().toISOString();
    try{let pr;metGlobaal(()=>{pr=BE.save(S,prev)});const r=await pr;S.rev=(r&&r.rev)||prev+1;UI.saving=false;
      // Tijdens het opslaan opnieuw gewijzigd? Dan blijft het concept staan en volgt er nog een opslag.
      if((UI.wijzigingen||0)===n){UI.dirty=false;store.del(DRAFT)}else{saveDraft();autoSave()}
      if(!auto)toast('Opgeslagen. Iedereen ziet nu de nieuwe stand.')}
    catch(e){UI.saving=false;UI.autoStop=true;if(e&&e.code==='conflict')toast('Iemand anders heeft intussen opgeslagen. Herlaad de pagina; je wijzigingen staan als concept klaar.',true);else if(e&&e.code==='not_writer'){UI.editor=false;toast('Je hebt geen beheerdersrechten voor de huisrekening.',true)}else toast('Automatisch opslaan is mislukt: '+((e&&e.message)||e)+'. Klik op Opslaan om het opnieuw te proberen.',true)}
    render();herstelFocus();return}
  if(!ART){toast(UI.local?'Dit is een lokale kopie. Opslaan werkt alleen in de versie op claude.ai.':'Opslaan is in deze weergave niet beschikbaar. Open de huisrekening op claude.ai.',true);return}
  UI.saving=true;render();
  S.rev=(S.rev||0)+1;S.savedAt=new Date().toISOString();
  try{await ART.publish(buildDocument());store.del(DRAFT)}
  catch(e){S.rev--;UI.saving=false;const c=e&&e.code;
    if(c==='conflict'){toast('Iemand anders heeft net opgeslagen. De pagina laadt de nieuwste versie; jouw wijzigingen staan nog als concept klaar.',true)}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){UI.editor=false;store.del('huis.edit');toast('Je hebt geen bewerkrechten op deze huisrekening. De eigenaar kan je via het Delen-menu als bewerker toevoegen.',true)}
    else if(c==='rate_limited'){toast('Even te vaak opgeslagen. Wacht een minuut en probeer het opnieuw.',true)}
    else toast('Opslaan is mislukt ('+(c||'onbekend')+'). Probeer het zo nog eens; je wijzigingen staan als concept klaar.',true);
    render()}
}

function statementHTML(pid,m){
  const B=bill(m.id),b=B[pid];if(!b)return '';

  const groups={};for(const [ix,l] of b.lines.entries()){(groups[l.cat]=groups[l.cat]||[]).push([ix,l])}

      if(open)rows.push(`<tr class="det"><td colspan="2">${lineDetail(l,pid,m)}</td></tr>`)}
  }

  rows.push(gRow('__pay','Betalingen',eur(-b.paid),(b.payments||[]).length||(b.paid?1:0)));

function lineMatrix(m,filter,o){
  const B=bill(m.id),cols=[],rows=[];
  for(const p of S.people){const b=B[p.id];if(!b)continue;const ls=b.lines.filter(filter);if(!ls.length)continue;
    const cells={};let cnt=null;for(const l of ls){if(!cols.includes(l.label))cols.push(l.label);cells[l.label]=(cells[l.label]||0)+l.amount;
      if(o.count&&l.label===o.count.label){const mm=(l.how||'').match(o.count.re);if(mm)cnt=(cnt||0)+(+mm[1])}}
    rows.push({p,cells,cnt})}
  if(!cols.length)return o.empty?`<section class="block"><h2>${o.title}</h2><div class="empty">${o.empty}</div></section>`:'';
  rows.sort((a,b)=>byName(a.p,b.p));
  const colTot=c=>sum(rows.map(r=>r.cells[c]||0)),hc=cols.length+(o.count?1:0)>6?'c':'r wrap';
  return `<section class="block"><h2>${o.title}</h2>${o.note?`<p class="note">${o.note}</p>`:''}
    <div class="scroll tbl"><table class="matrix"><thead><tr><th class="n">Naam</th>${o.count?`<th class="${hc}">${esc(o.count.title)}</th>`:''}${cols.map(c=>`<th class="${hc}">${esc(c)}</th>`).join('')}<th class="r">Totaal</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="n">${esc(r.p.name)}</td>${o.count?`<td class="r num">${r.cnt??'<span class="muted">—</span>'}</td>`:''}${cols.map(c=>`<td class="r num">${r.cells[c]?eur(r.cells[c]):'<span class="muted">—</span>'}</td>`).join('')}<td class="r num"><b>${eur(sum(Object.values(r.cells)))}</b></td></tr>`).join('')}
      <tr class="total"><td class="n">Totaal</td>${o.count?`<td class="r num">${sum(rows.map(r=>r.cnt||0))}</td>`:''}${cols.map(c=>`<td class="r num">${eur(colTot(c))}</td>`).join('')}<td class="r num">${eur(sum(cols.map(colTot)))}</td></tr>
    </tbody></table></div></section>`;
}
function correctieMatrix(m){
  return lineMatrix(m,l=>l.cat==='Extra correctie',{title:`Verdeling ${esc(m.label.toLowerCase())}`,note:`Wat iedereen per kopje betaalt in ${esc(m.label.toLowerCase())}, zoals in het oude Excel-blad Extra Correctie.`,empty:`Er staan nog geen extra correcties op de rekening van ${esc(m.label.toLowerCase())}.`});
}
const isHL=l=>!['Extra correctie','Pils','Servicekosten','Correctie'].includes(l.cat);
function hlPosts(mid){
  const B=bill(mid),posts={};
  for(const p of S.people){const b=B[p.id];if(!b)continue;for(const l of b.lines)if(isHL(l)){const key=l.cat+'|'+l.label;
    const x=posts[key]=posts[key]||{label:l.label,cat:l.cat,total:0,n:0,per:new Set(),ref:l.ref,how:l.how};x.total+=l.amount;x.n++;x.per.add(r2(l.amount))}}
  return Object.values(posts);
}
function hlMonthTotal(h,mid){
  if(h.type==='pp')return (+h.amountPP||0)*h.payers.filter(id=>P(id)).length;
  return sum(S.transactions.filter(t=>t.monthId===mid&&t.kind==='cost'&&t.huislastId===h.id).map(t=>-t.amount));
}
// Vaste lasten die in het afschrift terugkomen maar nog geen huislast zijn (afschrijvingen in 2+ maanden).
function hlSuggesties(){
  const g={};
  for(const t of S.transactions){if(t.kind!=='todo'||!(t.amount<0))continue;const mo=M(t.monthId);if(!mo||mo.closed)continue;
    const k=(t.name||'').toUpperCase().trim();if(!k)continue;const x=g[k]=g[k]||{name:k,months:new Set(),last:t,n:0};x.months.add(t.monthId);x.n++;if((t.date||'')>(x.last.date||''))x.last=t}
  const alle={};for(const t of S.transactions){if(!(t.amount<0))continue;const k=(t.name||'').toUpperCase().trim();(alle[k]=alle[k]||new Set()).add(t.monthId)}
  return Object.values(g).filter(x=>(alle[x.name]||x.months).size>=2).sort((a,b)=>a.name.localeCompare(b.name));
}
// Huislasten als één tabel: kolommen = huislasten (naam, totaal, soort), rijen = huisgenoten op anciënniteit.
function vHuislasten(m){
  const hl=S.huislasten||[],om=openMonth(),ed=UI.editor&&!vast(m),B=bill(m.id),dicht=m.closed&&m.bewerkt&&m.basisLines;
  // Wat iemand deze maand voor een huislast betaalt, uit de regels van de rekening.
  // Regels uit oude (geïmporteerde) maanden hebben geen koppeling; die herkennen we aan de naam (Prime → Amazon Prime).
  const norm=x=>String(x||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
  const opNaam=l=>{if(!isHL(l))return null;const a=norm(l.label);return hl.find(h=>norm(h.name)===a)||hl.find(h=>{const b=norm(h.name);return a&&b&&(b.includes(a)||a.includes(b))})||null};
  const hoort=(l,h)=>l.ref?((l.ref.type==='hl'&&l.ref.id===h.id)||(l.ref.type==='tx'&&(T(l.ref.id)||{}).huislastId===h.id)):opNaam(l)===h;
  const regels=(lines,h)=>sum((lines||[]).filter(l=>hoort(l,h)).map(l=>l.amount));
  // Afgesloten maand: het vastgezette bedrag plus wat jouw aanpassing verandert (nu − bij openzetten).
  const bedrag=(id,h)=>{const b=B[id];const vastB=b?regels(b.lines.filter(l=>l.cat!=='Correctie'),h):0;
    if(!dicht)return vastB;const R=herbereken(m);return vastB+regels(R[id]&&R[id].lines,h)-regels(m.basisLines[id],h)};
  const totaal=h=>sum(Object.keys(B).map(id=>bedrag(id,h)));
  const ppl=[...S.people].sort(byName).filter(p=>UI.matrixAll||HOUSE.includes(p.status)||hl.some(h=>h.payers.includes(p.id)||Math.abs(bedrag(p.id,h))>0.004));
  const sug=ed?hlSuggesties():[];
  const kop=h=>ed?`<input id="hn-${h.id}" value="${esc(h.name)}" data-ch="hl" data-id="${h.id}" data-f="name" aria-label="Naam huislast" class="hl-naam">`
    +`<button class="ghost danger hl-weg" data-act="delhl" data-id="${h.id}" aria-label="Huislast ${esc(h.name)} verwijderen" title="Verwijderen">×</button>`:esc(h.name);
  const soort=h=>ed?`<select id="ht-${h.id}" data-ch="hl" data-id="${h.id}" data-f="type" aria-label="Soort"><option value="bank" ${h.type!=='pp'?'selected':''}>Bank</option><option value="pp" ${h.type==='pp'?'selected':''}>Vast p.p.</option></select>`
      +(h.type==='pp'?`<input type="number" step="0.01" id="ha-${h.id}" value="${h.amountPP||''}" data-ch="hl" data-id="${h.id}" data-f="amountPP" placeholder="€ p.p." aria-label="Bedrag per persoon per maand">`
        :`<input id="hm-${h.id}" value="${esc(h.match||'')}" placeholder="banktekst" data-ch="hl" data-id="${h.id}" data-f="match" aria-label="Banktekst">`)
    :`<span class="small muted">${h.type==='pp'?'vast '+eur(+h.amountPP||0)+' p.p.':'bank: '+esc(h.match||'—')}</span>`;
  const cel=(p,h)=>{const v=bedrag(p.id,h),txt=Math.abs(v)>0.004?eur(v):'<span class="muted">—</span>';
    return ed?`<td class="r num"><label class="hl-cel"><input type="checkbox" id="hp-${h.id}-${p.id}" data-ch="hlpayer" data-id="${h.id}" data-pid="${p.id}" ${h.payers.includes(p.id)?'checked':''} aria-label="${esc(p.name)} betaalt ${esc(h.name)}"> ${txt}</label></td>`
      :`<td class="r num">${txt}</td>`};
  const tabel=`<div class="scroll tbl"><table class="hl-tabel"><thead>
      <tr><th class="n">Huislast</th>${hl.map(h=>`<th class="r">${kop(h)}</th>`).join('')}<th class="r">Totaal</th></tr>
      <tr class="hl-info"><td class="n">Totaalprijs</td>${hl.map(h=>`<td class="r num"><b>${eur(totaal(h))}</b></td>`).join('')}<td class="r num"><b>${eur(sum(hl.map(totaal)))}</b></td></tr>
      <tr class="hl-info"><td class="n">Vast p.p. / bank</td>${hl.map(h=>`<td class="r">${soort(h)}</td>`).join('')}<td></td></tr>
      ${ed?`<tr class="hl-info"><td class="n small muted">Snel kiezen</td>${hl.map(h=>`<td class="r"><select id="hf-${h.id}" data-ch="hlfill" data-id="${h.id}" aria-label="Snel kiezen voor ${esc(h.name)}"><option value="">…</option><option value="bewoner">Alle bewoners</option><option value="huis">Alle huisgenoten</option><option value="none">Niemand</option></select></td>`).join('')}<td></td></tr>`:''}
    </thead><tbody>
      ${ppl.map(p=>{const alle=hl.length&&hl.every(h=>h.payers.includes(p.id));
        return `<tr><td class="n">${ed?`<label class="hl-cel" title="${alle?'Voor geen enkele':'Voor alle'} huislasten aanslaan"><input type="checkbox" id="hr-alle-${p.id}" data-ch="hlrij" data-pid="${p.id}" ${alle?'checked':''} aria-label="${esc(p.name)} voor alle huislasten aanslaan"> ${esc(p.name)}</label>`:esc(p.name)}</td>${hl.map(h=>cel(p,h)).join('')}<td class="r num"><b>${eur(sum(hl.map(h=>bedrag(p.id,h))))}</b></td></tr>`}).join('')}
      <tr class="total"><td class="n">Betalers</td>${hl.map(h=>`<td class="r num">${ppl.filter(p=>Math.abs(bedrag(p.id,h))>0.004).length}</td>`).join('')}<td></td></tr>

function vService(m){

    const rows=S.people.map(p=>{const b=B[p.id];const l=b&&b.lines.find(x=>x.cat==='Servicekosten');return l?{p,l,mm:(l.how||'').match(re),room:S.rooms.find(r=>r.personId===p.id)}:null}).filter(Boolean).sort((a,b)=>byName(a.p,b.p));

      <div class="scroll tbl"><table><thead><tr><th>Naam</th><th class="hide-sm">Kamer</th>${parsed?'<th class="r">Gemiddeld</th><th class="r">Kamer</th><th class="r">Correctie kale huur</th><th class="r">Money Underdogs</th>':'<th>Berekening</th>'}<th class="r">Correctie</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="hide-sm">${r.room?esc(r.room.name)+' <span class="muted small">'+esc(r.room.code)+'</span>':'—'}</td>${parsed?r.mm.slice(1).map(v=>`<td class="r num">${v==='€0,00'?'<span class="muted">—</span>':esc(v)}</td>`).join(''):`<td class="small muted">${esc(r.l.how||'')}</td>`}<td class="r num"><b>${eur(r.l.amount)}</b></td></tr>`).join('')}
        <tr class="total"><td>Totaal</td><td class="hide-sm"></td>${parsed?'<td></td><td></td><td></td><td></td>':'<td></td>'}<td class="r num">${eur(sum(rows.map(r=>r.l.amount)))}</td></tr>

  const roomRows=S.rooms.map(r=>{const p=P(r.personId),known=r.servicekosten!=null&&r.servicekosten!=='';return {r,p,known,diff:known&&p?avg-r.servicekosten:0,kale:p?+p.kaleHuurCorr||0:0,mu:p?+p.moneyUnderdogs||0:0}});
  const noRoom=housePeople().filter(p=>!S.rooms.some(r=>r.personId===p.id)).sort(byName);
  const corrIn=(p,f,v)=>ok&&p?`<input type="number" step="0.01" id="sv-${f}-${p.id}" value="${v?r2(v):''}" placeholder="—" data-ch="pfield" data-id="${p.id}" data-f="${f}" style="width:5.5rem" aria-label="${f==='moneyUnderdogs'?'Money Underdogs':'Correctie kale huur'} ${esc(p.name)}">`:`<span class="num">${z(v)}</span>`;
  return `<section class="block"><h2>Servicekosten ${esc(m.label.toLowerCase())}</h2>
    <p class="note">De correctie per persoon bestaat uit drie delen. <b>Verschil met gemiddeld</b> geldt voor iedereen met een kamer: iedereen betaalt het gemiddelde (${eur(avg)}), wie een duurdere kamer heeft krijgt het verschil terug en wie goedkoper zit betaalt bij. <b>Correctie kale huur</b> is een vaste afspraak per kamer. <b>Money Underdogs</b> geldt alleen voor de kamers zonder huurtoeslag. Laat de servicekosten leeg als ze onbekend zijn; de kamer telt dan als gemiddeld.</p>
    ${m.includeService!==false?'':'<div class="panel"><p class="note">Let op: de servicekosten-correctie staat voor deze maand uit (Overzicht → Maand beheren).</p></div>'}
    <div class="scroll tbl"><table><thead><tr><th>Kamer</th><th>Bewoner</th><th>Huurtoeslag</th><th class="r">Servicekosten</th><th class="r">Verschil met gemiddeld</th><th class="r">Correctie kale huur</th><th class="r">Money Underdogs</th><th class="r">Totaal p.m.</th>${ok?'<th></th>':''}</tr></thead><tbody>
      ${roomRows.map(x=>`<tr><td>${ok?`<input id="rn-${x.r.id}" value="${esc(x.r.name)}" data-ch="room" data-id="${x.r.id}" data-f="name" style="width:9rem" aria-label="Kamernaam">`:esc(x.r.name)} <span class="small muted">${esc(x.r.code)}</span></td>
        <td>${ok?`<select id="rp-${x.r.id}" data-ch="room" data-id="${x.r.id}" data-f="personId" aria-label="Bewoner"><option value="">Leeg</option>${[...S.people].filter(p=>HOUSE.includes(p.status)||p.id===x.r.personId).sort(byName).map(p=>`<option value="${p.id}" ${p.id===x.r.personId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:esc(x.p?x.p.name:'leeg')}</td>
        <td>${ok?`<input type="checkbox" id="rh-${x.r.id}" data-ch="roomtoeslag" data-id="${x.r.id}" ${x.r.huurtoeslag?'checked':''} aria-label="Huurtoeslag ${esc(x.r.name)}">`:(x.r.huurtoeslag?'ja':'nee')}</td>
        <td class="r">${ok?`<input type="number" step="0.01" id="rs-${x.r.id}" value="${x.r.servicekosten??''}" placeholder="gemiddeld" data-ch="room" data-id="${x.r.id}" data-f="servicekosten" style="width:6.5rem" aria-label="Servicekosten">`:`<span class="num">${x.known?eur(x.r.servicekosten):'gemiddeld'}</span>`}</td>
        <td class="r num">${x.p?eur(x.diff):'—'}</td><td class="r">${corrIn(x.p,'kaleHuurCorr',x.kale)}</td><td class="r">${corrIn(x.p,'moneyUnderdogs',x.mu)}</td>
        <td class="r num"><b>${x.p?eur(x.diff+x.kale+x.mu):'—'}</b></td>${ok?`<td><button class="ghost danger" data-act="delroom" data-id="${x.r.id}" aria-label="Kamer verwijderen">×</button></td>`:''}</tr>`).join('')}
      ${noRoom.map(p=>`<tr><td class="muted">geen kamer gekoppeld</td><td>${esc(p.name)}</td><td></td><td></td><td class="r num">${z(0)}</td><td class="r">${corrIn(p,'kaleHuurCorr',+p.kaleHuurCorr||0)}</td><td class="r">${corrIn(p,'moneyUnderdogs',+p.moneyUnderdogs||0)}</td><td class="r num"><b>${eur(out[p.id]||0)}</b></td>${ok?'<td></td>':''}</tr>`).join('')}
      <tr class="total"><td>Totaal</td><td></td><td></td><td class="r num">${eur(sum(S.rooms.filter(r=>r.servicekosten!=null&&r.servicekosten!=='').map(r=>+r.servicekosten)))}</td><td class="r num">${eur(sum(Object.values(parts).map(x=>x.diff)))}</td><td class="r num">${eur(sum(Object.values(parts).map(x=>x.kale)))}</td><td class="r num">${eur(sum(Object.values(parts).map(x=>x.mu)))}</td><td class="r num">${eur(sum(Object.values(out)))}</td>${ok?'<td></td>':''}</tr>
    </tbody></table></div>

    ${ok?'<div><button data-act="addroom">+ Kamer</button></div>':''}</section>`;
}

function pilsHistory(){

  const saved=S.pilsSettings;
  const rows=ms.map(m=>{let pc;if(m.closed&&m.pils.prices){const keep={...S.pilsSettings};S.pilsSettings={...keep,barPrice:m.pils.prices.bp,flesPrice:m.pils.prices.fp,fust20Price:m.pils.prices.fust20,fust50Price:m.pils.prices.fust50,kratPrice:m.pils.prices.krat,plexPrice:m.pils.prices.plex,gasPrice:m.pils.prices.gas};pc=pilsCalc(m.pils);S.pilsSettings=keep}else pc=pilsCalc(m.pils);

  S.pilsSettings=saved;
  return `<section class="block"><h2>Verloop per maand</h2><div class="scroll tbl"><table><thead><tr><th>Maand</th><th class="r">Fusten gekocht</th><th class="r">Doorheen</th><th class="r">Afgekocht</th><th class="r">Tapturven</th><th class="r">Tapverlies</th><th class="r">Kratten gekocht</th><th class="r">Doorheen</th><th class="r">Afgekocht</th><th class="r">Flesjes</th><th class="r">Flesverlies</th><th class="r">Verlies €</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`;

    // Ook met een saldo mag je iemand verwijderen; afgesloten maanden en oude transacties blijven staan.
    ask(`${P(id).name} verwijderen?`+(used?' Deze persoon heeft nog een saldo of transacties. Die tellen dan niet meer mee in de lopende maand; afgesloten maanden blijven zoals ze zijn.':''),'Verwijderen',()=>mutate(()=>{S.people=S.people.filter(p=>p.id!==id);for(const c of S.categories)c.payers=c.payers.filter(x=>x!==id);for(const h of S.huislasten||[])h.payers=h.payers.filter(x=>x!==id);for(const e of S.events||[])if(e.participants)e.participants=e.participants.filter(x=>x!==id);for(const r of S.rooms)if(r.personId===id)r.personId=null}))},
  addroom:()=>mutate(()=>S.rooms.push({id:uid('k'),name:'Nieuwe kamer',code:'',servicekosten:null,huurtoeslag:false,personId:null})),
  delroom:el=>ask('Kamer verwijderen?','Verwijderen',()=>mutate(()=>{S.rooms=S.rooms.filter(r=>r.id!==el.dataset.id)})),
  addrc:()=>mutate(()=>S.recurring.push({id:uid('rc'),label:'Nieuw vast bedrag',categoryId:S.categories[0].id,amount:0})),
  delrc:el=>mutate(()=>{S.recurring=S.recurring.filter(r=>r.id!==el.dataset.id)}),
  addrule:()=>mutate(()=>S.bankRules.push({id:uid('r'),match:'',action:'cost',categoryId:'vast',label:''})),
  delrule:el=>mutate(()=>{S.bankRules=S.bankRules.filter(r=>r.id!==el.dataset.id)}),
  addext:()=>mutate(()=>{S.kas.extern=S.kas.extern||[];S.kas.extern.push({id:uid('x'),label:'Nieuwe debiteur',amount:0})}),
  delext:el=>mutate(()=>{S.kas.extern=S.kas.extern.filter(x=>x.id!==el.dataset.id)}),
  adddas:()=>mutate(()=>{S.dassen=S.dassen||[];S.dassen.push({id:uid('d'),label:'Nieuw artikel',count:0})}),
  deldas:el=>mutate(()=>{S.dassen=S.dassen.filter(x=>x.id!==el.dataset.id)}),
};
const list=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
const toggleIn=(arr,id,on)=>{const s=new Set(arr||[]);on?s.add(id):s.delete(id);return [...s]};
const changes={
  kiesmaand:el=>{UI.month=el.value;UI.open=null;UI.lineOpen=null;render()},
  me:el=>{UI.me=el.value;UI.lineOpen=null;store.set('huis.me',el.value);render()},
  mfrom:el=>mutate(()=>{M(UI.month).from=el.value}),
  mto:el=>mutate(()=>{M(UI.month).to=el.value}),
  msvc:el=>mutate(()=>{M(UI.month).includeService=el.checked}),
  csvfile:el=>{const f=el.files&&el.files[0];if(!f)return;
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){const rb=new FileReader();rb.onload=()=>importPDF(rb.result);rb.readAsArrayBuffer(f);return}
    const rd=new FileReader();rd.onload=()=>{const txt=rd.result;if(txt.indexOf(String.fromCharCode(65533))>=0){const r2=new FileReader();r2.onload=()=>importING(r2.result);r2.readAsText(f,'windows-1252')}else importING(txt)};rd.readAsText(f,'utf-8')},
  restore:el=>{const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.people||!d.months)throw 0;
    ask(`Back-up van ${d.savedAt?new Date(d.savedAt).toLocaleDateString('nl-NL'):'onbekende datum'} terugzetten? Alles wat nu in de app staat wordt vervangen.`,'Terugzetten',()=>{const rev=S.rev;mutate(()=>{S=migrate(d);S.rev=rev});toast('Back-up teruggezet. Klik op Opslaan en delen om hem te publiceren.')})}
    catch(e){toast('Dit is geen geldig back-upbestand van de huisrekening.',true)}};rd.readAsText(f)},
  txkind:el=>{const t=T(el.dataset.id),v=el.value;
    if(v==='newevent'){const om=vast(M(t.monthId))?openMonth():M(t.monthId)||openMonth();const e={id:uid('e'),name:t.label||t.name,categoryId:'activiteit',date:t.date,participants:[...(C('activiteit')||{payers:[]}).payers],overrides:{},extra:0,billMonth:om.id};
      mutate(()=>{S.events.push(e);Object.assign(t,{kind:'event',eventId:e.id,suggested:false})});toast(`Kopje “${e.name}” aangemaakt onder Extra correctie. Stel de deelnemers in op het tabblad Extra correctie.`);return}
    if(v==='newhl'){const id=uid('hl'),v2=C('vast');
      mutate(()=>{S.huislasten.push({id,name:t.label||t.name,match:t.name.toUpperCase().trim(),type:'bank',amountPP:0,group:'Vaste lasten',payers:[...(v2?v2.payers:[])]});Object.assign(t,{kind:'cost',huislastId:id,categoryId:null,eventId:null,personId:null,pilsPost:null,suggested:false})});
      toast(`Huislast “${t.label||t.name}” aangemaakt. Kies op het tabblad Huislasten wie hem betaalt.`);return}
    if(v==='newpils'){const pl=(M(t.monthId)||{}).pils;if(!pl)return;const id=uid('sp');
      mutate(()=>{pl.shared=pl.shared||[];pl.shared.push({id,kind:'amount',label:t.label||t.name,count:0,price:0,amount:0});Object.assign(t,{kind:'pils',pilsPost:id,suggested:false,categoryId:null,eventId:null,personId:null})});toast(`Post “${t.label||t.name}” toegevoegd aan de gedeelde kosten van de pilsrekening.`);return}
    mutate(()=>{t.suggested=false;t.auto=false;const [k,id]=v.split(':');
      t.kind=k==='pay'?'payment':k==='hl'?'cost':k;t.personId=k==='pay'?id:null;t.categoryId=k==='cost'?id:(t.kind==='kas'?t.categoryId:null);t.eventId=k==='event'?id:null;
      t.huislastId=k==='hl'?id:null;if(k==='hl'&&H(id))t.label=H(id).name;t.pilsPost=k==='pils'?id:null;
      if(k!=='cost'&&k!=='hl')t.participants=null;
      if(k==='voorschot'){UI.txOpen=t.id;if(!t.vsWhat)t.vsWhat=''}
      if(k==='pay'&&t.iban){const p=P(id);for(const q of S.people)q.ibans=(q.ibans||[]).filter(x=>x!==t.iban);p.ibans=[...(p.ibans||[]),t.iban]}})},
  txvs:el=>{const t=T(el.dataset.id),f=el.dataset.f;mutate(()=>{t[f]=f==='vsWhat'?el.value.trim():Math.max(0,Math.round(num(el.value)||0))})},
  txlabel:el=>mutate(()=>{T(el.dataset.id).label=el.value.trim()}),
  txamount:el=>mutate(()=>{T(el.dataset.id).amount=-Math.abs(num(el.value)||0)}),
  txpaidby:el=>mutate(()=>{T(el.dataset.id).paidBy=el.value||null}),
  txcustom:el=>{const t=T(el.dataset.id);mutate(()=>{t.participants=el.checked?[...(t.huislastId?((H(t.huislastId)||{}).payers||[]):((C(t.categoryId)||{}).payers||[]))]:null})},
  txpart:el=>{const t=T(el.dataset.id);mutate(()=>{t.participants=toggleIn(t.participants,el.dataset.pid,el.checked);if(!t.participants.length)t.participants=null})},
  nt:el=>{const f=el.dataset.f;UI.newTx[f]=f==='amount'?num(el.value):el.value},
  ev:el=>{const e=E(UI.eventId),f=el.dataset.f;mutate(()=>{e[f]=f==='extra'?(num(el.value)||0):(f==='billMonth'?(el.value||null):el.value)})},
  evpart:el=>{const e=E(UI.eventId);mutate(()=>{e.participants=toggleIn(e.participants,el.dataset.pid,el.checked)})},
  evover:el=>{const e=E(UI.eventId),pid=el.dataset.pid,v=num(el.value);mutate(()=>{e.overrides=e.overrides||{};if(v==null)delete e.overrides[pid];else e.overrides[pid]=v})},
  pl:el=>{const pl=curPils(),f=el.dataset.f;mutate(()=>{pl[f]=num(el.value)||0})},
  pfust:el=>{const f=el.dataset.f,v=num(el.value);mutate(()=>{curPils().fust[f]=(f.startsWith('end')&&v==null)?null:Math.max(0,v||0)})},
  pkrat:el=>{const f=el.dataset.f,v=num(el.value);mutate(()=>{curPils().krat[f]=(f==='end'&&v==null)?null:Math.max(0,v||0)})},
  spost:el=>{const x=curPils().shared.find(y=>y.id===el.dataset.id),f=el.dataset.f;mutate(()=>{x[f]=f==='label'?el.value:(num(el.value)||0)})},
  pho:el=>mutate(()=>{curPils()[el.dataset.f].ho=Math.max(0,Math.round(num(el.value)||0))}),
  turf:el=>{const pl=curPils(),loc=el.dataset.f,v=num(el.value);mutate(()=>{const t=pl[loc].turven;if(!v)delete t[el.dataset.pid];else t[el.dataset.pid]=Math.max(0,Math.round(v))})},
  plpayer:el=>mutate(()=>{const pl=curPils();pl.payers=toggleIn(pl.payers,el.dataset.pid,el.checked)}),
  afk:el=>{const a=curPils().afkoop.find(x=>x.id===el.dataset.id),f=el.dataset.f;mutate(()=>{a[f]=f==='count'?Math.max(0,num(el.value)||0):el.value})},
  afkpart:el=>{const a=curPils().afkoop.find(x=>x.id===el.dataset.id);mutate(()=>{a.participants=toggleIn(a.participants,el.dataset.pid,el.checked)})},
  ps:el=>{const f=el.dataset.f;mutate(()=>{S.pilsSettings[f]=el.dataset.num?(num(el.value)):el.value;if(el.dataset.num&&!['barPrice','flesPrice'].includes(f)&&S.pilsSettings[f]==null)S.pilsSettings[f]=0})},
  beheer:el=>mutate(()=>{S.house.beheerders=toggleIn(S.house.beheerders,el.dataset.pid,el.checked)}),
  kas:el=>{const f=el.dataset.f;mutate(()=>{S.kas[f]=f==='bankDate'?el.value:(num(el.value)||0)})},
  ext:el=>{const x=S.kas.extern.find(y=>y.id===el.dataset.id),f=el.dataset.f;mutate(()=>{x[f]=f==='amount'?(num(el.value)||0):el.value})},
  das:el=>{const x=S.dassen.find(y=>y.id===el.dataset.id),f=el.dataset.f;mutate(()=>{x[f]=f==='count'?Math.round(num(el.value)||0):el.value})},
  dasnote:el=>mutate(()=>{S.dassenNote=el.value}),
  afspraken:el=>mutate(()=>{S.afspraken=el.value.split('\n').map(x=>x.trim()).filter(Boolean)}),
  pfield:el=>{const p=P(el.dataset.id),f=el.dataset.f;mutate(()=>{p[f]=(f==='ibans')?list(el.value).map(x=>x.replace(/\s/g,'').toUpperCase()):f==='aliases'?list(el.value):(['fixedCorrection','startSaldo','kaleHuurCorr','moneyUnderdogs'].includes(f))?(num(el.value)||0):el.value})},
  catpayer:el=>{const c=C(el.dataset.id),pid=el.dataset.pid;mutate(()=>{const s=new Set(toggleIn(c.payers,pid,el.checked));c.payers=S.people.map(p=>p.id).filter(id=>s.has(id))})},
  cat:el=>{const c=C(el.dataset.id),f=el.dataset.f;mutate(()=>{c[f]=f==='minimum'?(num(el.value)||0):el.value})},
  rc:el=>{const x=S.recurring.find(y=>y.id===el.dataset.id),f=el.dataset.f;mutate(()=>{x[f]=f==='amount'?(num(el.value)||0):el.value})},
  hl:el=>{const h=H(el.dataset.id),f=el.dataset.f;mutate(()=>{h[f]=f==='amountPP'?(num(el.value)||0):f==='match'?el.value.toUpperCase().trim():el.value})},
  hlrij:el=>{const pid=el.dataset.pid,aan=el.checked;mutate(()=>{for(const h of S.huislasten||[]){const s2=new Set(toggleIn(h.payers,pid,aan));h.payers=S.people.map(p=>p.id).filter(id=>s2.has(id))}});toast(`${P(pid).name} ${aan?'betaalt nu alle':'betaalt geen'} huislasten meer mee.`.replace('alle huislasten meer mee','alle huislasten mee'))},
  hlpayer:el=>{const h=H(el.dataset.id);mutate(()=>{const s2=new Set(toggleIn(h.payers,el.dataset.pid,el.checked));h.payers=S.people.map(p=>p.id).filter(id=>s2.has(id))})},
  hlfill:el=>{const h=H(el.dataset.id),f=el.value;if(!f)return;mutate(()=>{h.payers=f==='none'?[]:S.people.filter(p=>f==='bewoner'?p.status==='bewoner':['bewoner','huisgenoot'].includes(p.status)).map(p=>p.id)})},
  roomtoeslag:el=>{const r=S.rooms.find(y=>y.id===el.dataset.id);mutate(()=>{r.huurtoeslag=el.checked})},
  room:el=>{const r=S.rooms.find(y=>y.id===el.dataset.id),f=el.dataset.f;
    // Eén persoon staat nooit op twee kamers: bij toewijzen gaat hij van zijn oude kamer af.
    const oud=f==='personId'&&el.value?S.rooms.find(y=>y!==r&&y.personId===el.value):null;
    mutate(()=>{r[f]=f==='servicekosten'?num(el.value):(f==='personId'?(el.value||null):el.value);if(oud)oud.personId=null});
    if(oud)toast(`${P(el.value).name} is verhuisd van ${oud.name} naar ${r.name}; ${oud.name} staat nu leeg.`)},
  rule:el=>{const r=S.bankRules.find(y=>y.id===el.dataset.id),f=el.dataset.f;mutate(()=>{r[f]=f==='match'?el.value.toUpperCase().trim():el.value})},
  sanc:el=>{const s=S.sanctions[+el.dataset.i],f=el.dataset.f;mutate(()=>{s[f]=f==='min'?(num(el.value)||0):el.value})},
  house:el=>mutate(()=>{S.house[el.dataset.f]=el.value}),
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){acts[el.dataset.act]&&acts[el.dataset.act](el,ev);return}
  if(ev.target.closest('input,select,textarea,label')&&el.tagName==='TR')return;
  if(el.dataset.act==='line'&&ev.target.closest('tr.det'))return;
  acts[el.dataset.act]&&acts[el.dataset.act](el,ev)});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-ch]');if(el&&changes[el.dataset.ch])changes[el.dataset.ch](el,ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&UI.confirm){UI.confirm=null;render()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-act]')){ev.preventDefault();acts[ev.target.dataset.act](ev.target)}});

/* ---------- start ---------- */
const draft=S?loadDraft():null;
async function boot(){
  render();
  if(BE){
    try{const r=await BE.load();if(!r||!r.data)throw new Error('geen gegevens gevonden');S=migrate(r.data);S.rev=r.rev??S.rev??1}
    catch(e){UI.loadMsg='De huisrekening kon niet geladen worden ('+((e&&e.message)||e)+'). Ben je ingelogd met een e-mailadres dat toegang heeft?';S=null;render();return}
    try{UI.editor=!!(await BE.canEdit())}catch(e){UI.editor=false}
    UI.beheerder=UI.editor;
    DL={save:async({filename,data})=>{if(BE.download)await BE.download(filename,data);else browserDownload(filename,data);return {status:'saved'}}};
    UI.month=(UI.editor?openMonth():(S.months.filter(m=>m.closed).slice(-1)[0]||openMonth())).id;
    if(store.get('huis.tab'))UI.tab=store.get('huis.tab');
    const d2=loadDraft();if(UI.editor&&d2){S=d2;UI.dirty=true;toast('Je niet-opgeslagen wijzigingen zijn teruggezet.')}
    billCache.clear();render();return;
  }
  if(UI.local){UI.editor=true;UI.month=openMonth().id;if(draft){S=draft;UI.dirty=true}render();return}
  const [user,art,dl]=await Promise.all([claude.use('user').catch(()=>null),claude.use('artifact').catch(()=>null),claude.use('downloads').catch(()=>null)]);
  ART=art;DL=dl;
  let edit=false;try{if(user)edit=(await user.canEdit())||(await user.isOwner())}catch(e){}
  if(!edit&&store.get('huis.edit')==='1'){edit=true;UI.forced=true}
  UI.editor=edit;
  if(UI.editor)UI.month=openMonth().id;
  if(UI.editor&&draft){S=draft;billCache.clear();UI.dirty=true;toast('Je niet-opgeslagen wijzigingen zijn teruggezet.')}
  render();
}
boot();
})();
</script>
